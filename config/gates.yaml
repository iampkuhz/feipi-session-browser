gates:
- name: pythonFormat
  description: 执行 pythonFormat 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 0
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    argv:
    - bash
    - scripts/session-browser.sh
    - format-check
- name: pythonLint
  description: 执行 pythonLint 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 1
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    argv:
    - bash
    - scripts/session-browser.sh
    - lint
- name: pythonCoverage
  description: 执行 pythonCoverage 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 2
    patterns:
    - pyproject.toml
