- name: ignoredTrackedFiles
  description: 执行 ignoredTrackedFiles 所定义的仓库质量检查。
  targets:
  - name: hook-runtime
    order: 0
    patterns:
    - .gitignore
    - scripts/checks/check_ignored_tracked_files.py
    - scripts/gates/**
    - config/gates.yaml
  tiers:
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    argv:
    - '{python}'
    - -m
    - scripts.checks
    - repository.ignored-tracked
    - --root
    - '{repo_root}'
    - --staged
    required_paths:
    - scripts/checks/check_ignored_tracked_files.py
- name: settingsJson
  description: 执行 settingsJson 所定义的仓库质量检查。
  targets:
  - name: hook-runtime
    order: 1
    patterns:
    - .claude/settings.json
    - .claude/settings.local.json
    - .codex/hooks.json
    - .qoder/settings.json
    - .qoder/settings.local.example.json
  tiers:
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    argv:
    - '{python}'
    - -c
    - import json,sys; [json.load(open(p, encoding='utf-8')) for p in sys.argv[1:]]
    existing_args:
    - .claude/settings.json
    - .codex/hooks.json
    - .qoder/settings.json
    - .qoder/settings.local.example.json
- name: bashSyntax
  description: 执行 bashSyntax 所定义的仓库质量检查。
  targets:
  - name: hook-runtime
    order: 2
    patterns:
    - .claude/hooks/**/*.sh
    - .codex/hooks/**/*.sh
    - .qoder/hooks/**/*.sh
    - scripts/hooks/**/*.sh
    - scripts/agent_runtime/**/*.sh
    - scripts/harness/**/*.sh
  - name: harness
    order: 0
    patterns:
    - scripts/harness/**/*.sh
  tiers:
  - quick
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    argv:
    - bash
    - -n
    glob_args:
    - .claude/hooks/**/*.sh
    - .codex/hooks/**/*.sh
    - .qoder/hooks/**/*.sh
    - scripts/harness/*.sh
- name: scriptCommentLanguage
  description: 执行 scriptCommentLanguage 所定义的仓库质量检查。
  targets:
