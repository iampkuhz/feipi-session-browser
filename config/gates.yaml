    order: 8
    patterns:
    - scripts/**/*.py
    - scripts/**/*.sh
  - name: java-build
    order: 6
    patterns:
    - config/technical-terms.json
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{python}'
    - -m
    - scripts.checks
    - source.comment-language
    - scripts
    required_paths:
    - scripts/checks/source/check_code_comment_language.py
    optional_args:
    - path: config/technical-terms.json
      argv:
      - --policy
      - '{repo_root}/config/technical-terms.json'
- name: pythonCompile
  description: 执行 pythonCompile 所定义的仓库质量检查。
