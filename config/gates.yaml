    - java/web/src/main/resources/static/**/*.js
    - java/web/src/main/resources/static/**/*.css
    - java/web/src/main/resources/templates/**/*.html
    - scripts/checks/check_code_comment_language.py
    - config/technical-terms.json
  tiers:
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    argv:
    - '{python}'
    - -m
    - scripts.checks
    - source.comment-language
    - --script-comments
    - scripts
    - .claude/hooks
    - .codex/hooks
    - .qoder/hooks
    - java/web/src/main/resources/static
    - java/web/src/main/resources/templates
    required_paths:
    - scripts/checks/check_code_comment_language.py
    optional_args:
    - path: config/technical-terms.json
      argv:
      - --policy
      - '{repo_root}/config/technical-terms.json'
- name: pythonCompile
  description: 执行 pythonCompile 所定义的仓库质量检查。
