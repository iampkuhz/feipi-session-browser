targets:
- name: python-standard
  description: 人工运行 Python 工具链与质量基础设施相关 Gate。
- name: harness
  description: 人工运行 Agent、Skill、Harness 与 OpenSpec 治理 Gate。
- name: session-detail
  description: 人工运行 Web 页面、静态资源与浏览器交互 Gate。
- name: java-src
  description: 人工运行 Java 源码与测试质量 Gate。
- name: java-build
  description: 人工运行 Gradle 构建与 Java 工程配置 Gate。
- name: scan-script-smoke
  description: 人工运行扫描命令、发行 CLI 与样本集成 Gate。
gate_files:
- gates/python-tooling.yaml
- gates/repository-safety.yaml
- gates/harness-governance.yaml
- gates/web-quality.yaml
- gates/java-quality.yaml
- gates/product-smoke.yaml
path_rules:
- category: acceptance-case
  patterns:
  - docs/acceptance-cases/**
  risk: medium
- category: java-test
  patterns:
  - java/**/src/test/java/**/*.java
  - java/**/src/test/kotlin/**/*.kt
  - java/**/src/test/resources/**
  risk: medium
- category: java-src
  patterns:
  - java/**/src/main/java/**/*.java
  - java/**/src/main/kotlin/**/*.kt
  risk: medium
- category: java-build
  patterns:
  - gradle/build-logic/**
  - gradle/**
  - config/technical-terms.json
  - config/api-snapshots/java-public-api.txt
  - config/architecture/java-modules.yaml
  - config/pmd/**
  - config/reuse-policy/**
  - settings.gradle.kts
  - java/**/build.gradle.kts
  - gradlew
  - gradlew.bat
  - '*.lockfile'
  risk: medium
- category: java-root-dsl
  patterns:
  - build.gradle.kts
  - gradle.properties
  risk: medium
- category: test
  patterns:
  - tests/**/*.py
  - tests/*.py
  risk: medium
- category: browser-test
  patterns:
  - tests/**/*.js
  - tests/*.js
  - tests/**/*.ts
  - tests/*.ts
  risk: medium
- category: session-detail-ui
  patterns:
  - java/web/src/main/resources/static/**
  - java/web/src/main/resources/templates/**
  - config/web-quality-baselines.json
  - src/session_browser/web/**
  - scripts/checks/web/**/*.py
  risk: medium
- category: quality-gate
  patterns:
  - scripts/checks/**
  - scripts/gates/**
  - config/gates.yaml
  - config/gates/**
  risk: high
- category: harness
  patterns:
  - harness/**
  - scripts/harness/**
  risk: high
- category: openspec
  patterns:
  - openspec/**
  - scripts/openspec/**/*.py
  risk: medium
- category: repo-script
  patterns:
  - scripts/*.sh
  - scripts/**/*.sh
  - scripts/*.js
  - scripts/**/*.js
  risk: high
- category: python-tooling-config
  patterns:
  - pyproject.toml
  - uv.lock
  - .pre-commit-config.yaml
  - .github/workflows/**
  risk: high
- category: agent-config
  patterns:
  - AGENTS.md
  - CLAUDE.md
  - skills/**
  - .agents/skills/**
  - .claude/settings.json
  - .claude/agents/**
  - .claude/commands/**
  - .claude/skills/**
  - .codex/**
  - .qoder/**
  risk: high
- category: docs
  patterns:
  - README.md
  - docs/**
  risk: low
- category: local-or-generated
  patterns:
  - tmp/**
  - data/**
  - output/**
  - .local/**
  - .pytest_cache/**
  - '**/*.sqlite'
  - '**/*.sqlite3'
  - '**/*.db'
  risk: local
- category: java-src-unknown
  patterns:
  - '**/*.java'
  risk: high
  allowed: false
- category: java-build-unknown
  patterns:
  - '**/*.gradle'
  - '**/*.gradle.kts'
  risk: high
  allowed: false
