    - scripts/**/*.sh
    - java/web/src/main/resources/static/**/*.js
    - java/web/src/main/resources/static/**/*.css
    - java/web/src/main/resources/templates/**/*.html
  - name: harness
    order: 1
    patterns:
    - .claude/hooks/**/*.sh
    - .codex/hooks/**/*.sh
    - .qoder/hooks/**/*.sh
    - scripts/**/*.py
    - scripts/**/*.sh
    - java/web/src/main/resources/static/**/*.js
