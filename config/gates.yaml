  description: 质量目标 python-standard 的确定性执行边界。
  includes: []
  parallel: true
  resources: []
  timeout: 300
- name: hook-runtime
  description: 质量目标 hook-runtime 的确定性执行边界。
  includes: []
  parallel: true
  resources: []
  timeout: 300
- name: harness
  description: 质量目标 harness 的确定性执行边界。
