version: gate-catalog:v4
targets:
- name: python-standard
  description: 质量目标 python-standard 的确定性执行边界。
  includes: []
- name: harness
  description: 质量目标 harness 的确定性执行边界。
  includes: []
- name: acceptance-contracts
  description: 质量目标 acceptance-contracts 的确定性执行边界。
  includes: []
- name: session-detail
  description: 质量目标 session-detail 的确定性执行边界。
  includes: []
- name: index
  description: 质量目标 index 的确定性执行边界。
  includes: []
- name: java-src
  description: 质量目标 java-src 的确定性执行边界。
  includes:
  - java-build
- name: java-build
  description: 质量目标 java-build 的确定性执行边界。
  includes: []
- name: scan-script-smoke
  description: 质量目标 scan-script-smoke 的确定性执行边界。
  includes: []
gates:
- name: pythonFormat
  description: 执行 pythonFormat 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 0
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - ruff
    - format
    - --check
    - .
- name: pythonLint
  description: 执行 pythonLint 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 1
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - ruff
    - check
    - --extend-select
    - I
    - .
- name: pythonCoverage
  description: 执行 pythonCoverage 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 2
    patterns:
    - pyproject.toml
    - tests/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - pytest
    - -W
    - error
    - tests/harness
    - tests/gates
    - tests/quality/test_contract_case_specs.py
    - tests/quality/test_java_classification.py
    - tests/quality/test_new_quality_gates.py
    - tests/quality/test_no_test_skips_gate.py
    - tests/quality/test_python_env_contract.py
    - tests/quality/test_repo_slimming_contract.py
    - tests/checks/test_code_comment_language_gate.py
    - tests/checks/test_python_security.py
    - --cov=scripts
    - --cov-branch
    - --cov-report=term-missing
    - --cov-report=xml:.local/python/coverage/coverage.xml
    - --cov-fail-under=0
- name: pythonAudit
  description: 执行 pythonAudit 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 3
    patterns:
    - pyproject.toml
    - uv.lock
    - scripts/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - scripts.checks
    - repository.python-security
    - --root
    - '{repo_root}'
    required_paths:
    - scripts/checks/repository/check_python_security.py
  network_failure: blocked
- name: pythonComplexity
  description: 生成 Python 复杂度债务报告，作为不阻断的维护建议。
  targets:
  - name: python-standard
    order: 4
    patterns:
    - pyproject.toml
    - scripts/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - radon
    - cc
    - --min
    - B
    - --show-complexity
    - --average
    - scripts
- name: pythonDeadCode
  description: 执行 pythonDeadCode 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 5
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - vulture
- name: pythonDeps
  description: 执行 pythonDeps 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 6
    patterns:
    - pyproject.toml
    - uv.lock
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{dev_python}'
    - -m
    - deptry
    - scripts
- name: ignoredTrackedFiles
  description: 执行 ignoredTrackedFiles 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 90
    patterns:
    - .gitignore
    - scripts/checks/repository/check_ignored_tracked_files.py
    - scripts/gates/**
    - config/gates.yaml
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{python}'
    - -m
    - scripts.checks
    - repository.ignored-tracked
    - --root
    - '{repo_root}'
    - --staged
    required_paths:
    - scripts/checks/repository/check_ignored_tracked_files.py
- name: misplacedGeneratedPaths
  description: 检查仓库磁盘上是否出现 manifest 禁止的生成路径。
  targets:
  - name: python-standard
    order: 7
  - name: acceptance-contracts
    order: 3
  - name: session-detail
    order: 11
  - name: index
    order: 1
  - name: java-src
    order: 11
  - name: java-build
    order: 5
  - name: scan-script-smoke
    order: 2
  tiers:
  - required
  - full
  timeout: 30
  incremental: always
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - '{python}'
    - -m
    - scripts.checks
    - repository.misplaced-generated-paths
    - --root
    - '{repo_root}'
    required_paths:
    - harness/manifest.yaml
    - scripts/checks/repository/check_misplaced_generated_paths.py
- name: bashSyntax
  description: 执行 bashSyntax 所定义的仓库质量检查。
  targets:
  - name: python-standard
    order: 91
    patterns:
    - scripts/**/*.sh
  tiers:
  - quick
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: command
    argv:
    - bash
    - -n
    glob_args:
    - scripts/**/*.sh
- name: scriptCommentLanguage
  description: 执行 scriptCommentLanguage 所定义的仓库质量检查。
  targets:
