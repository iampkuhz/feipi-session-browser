  tiers:
  - quick
  - required
  - full
  timeout: 300
  parallel: true
  resources: []
  incremental: patterns
  changed_files: none
  included_by: []
  receipt: content-sensitive
  command:
    capability: command
    target_argv:
      hook-runtime:
      - '{python}'
      - -m
      - compileall
      - -q
      - scripts/agent_runtime
      - scripts/checks
      harness:
      - '{python}'
      - -m
      - compileall
      - -q
      - scripts/harness
      - scripts/checks
      session-detail:
