version: gate-catalog:v6
targets:
- name: python-standard
- name: harness
- name: acceptance-contracts
- name: session-detail
- name: index
- name: java-src
  includes:
  - java-build
- name: java-build
- name: scan-script-smoke
gate_files:
- gates/python-tooling.yaml
- gates/repository-safety.yaml
- gates/harness-governance.yaml
- gates/web-quality.yaml
- gates/java-quality.yaml
- gates/product-smoke.yaml
path_rules:
- category: acceptance-contract
  patterns:
  - docs/acceptance-contracts/**
  risk: medium
  targets:
  - acceptance-contracts
- category: java-src
  patterns:
  - java/**/src/main/java/**/*.java
  - java/**/src/test/java/**/*.java
  - java/**/src/main/kotlin/**/*.kt
  - java/**/src/test/kotlin/**/*.kt
  risk: medium
  targets:
  - java-src
- category: java-build
  patterns:
  - gradle/build-logic/**
  - gradle/**
  - config/technical-terms.json
  - config/api-snapshots/java-public-api.txt
  - config/architecture/java-modules.yaml
  - config/pmd/**
  - config/reuse-policy/**
  - settings.gradle.kts
  - java/**/build.gradle.kts
  - gradlew
  - gradlew.bat
  - '*.lockfile'
  risk: medium
  targets:
  - java-build
- category: java-root-dsl
  patterns:
  - build.gradle.kts
  - gradle.properties
  risk: medium
  targets:
  - java-build
- category: session-detail-ui-test
  patterns:
  - tests/ui/**/*.py
  risk: medium
  targets:
  - session-detail
  - acceptance-contracts
  - python-standard
- category: test
  patterns:
  - tests/**/*.py
  - tests/*.py
  risk: medium
  targets:
  - acceptance-contracts
  - python-standard
- category: test-contract
  patterns:
  - tests/**/*.js
  - tests/*.js
  - tests/**/*.ts
  - tests/*.ts
  risk: medium
  targets:
  - acceptance-contracts
- category: session-detail-ui
  patterns:
  - java/web/src/main/resources/static/**
  - java/web/src/main/resources/templates/**
  - config/web-quality-baselines.json
  - src/session_browser/web/**
  - scripts/checks/web/**/*.py
  risk: medium
  targets:
  - session-detail
  - python-standard
- category: quality-gate
  patterns:
  - scripts/checks/**
  - scripts/gates/**
  - config/gates.yaml
  - config/gates/**
  risk: high
  targets:
  - python-standard
- category: harness
  patterns:
  - harness/**
  - scripts/harness/**
  risk: high
  targets:
  - harness
  - python-standard
- category: openspec
  patterns:
  - openspec/**
  - scripts/openspec/**/*.py
  risk: medium
  targets:
  - harness
  - python-standard
- category: repo-script
  patterns:
  - scripts/*.sh
  - scripts/**/*.sh
  - scripts/*.js
  - scripts/**/*.js
  risk: high
  targets:
  - python-standard
- category: python-tooling-config
  patterns:
  - pyproject.toml
  - uv.lock
  - .pre-commit-config.yaml
  - .github/workflows/**
  risk: high
  targets:
  - python-standard
- category: agent-config
  patterns:
  - AGENTS.md
  - CLAUDE.md
  - skills/**
  - .agents/skills/**
  - .claude/settings.json
  - .claude/agents/**
  - .claude/commands/**
  - .claude/skills/**
  - .codex/**
  - .qoder/**
  risk: high
  targets:
  - harness
- category: docs
  patterns:
  - README.md
  - docs/**
  risk: low
- category: local-or-generated
  patterns:
  - tmp/**
  - data/**
  - output/**
  - .local/**
  - .pytest_cache/**
  - '**/*.sqlite'
  - '**/*.sqlite3'
  - '**/*.db'
  risk: local
- category: java-src-unknown
  patterns:
  - '**/*.java'
  risk: high
  targets:
  - java-src
  allowed: false
- category: java-build-unknown
  patterns:
  - '**/*.gradle'
  - '**/*.gradle.kts'
  risk: high
  targets:
  - java-build
  allowed: false
gate_defaults:
  minimum_tier: required
  timeout: 300
  changed_files: none
  network_failure: fail
target_triggers:
- target: scan-script-smoke
  patterns:
  - scripts/session-browser.sh
  - java/app-cli/**
  - java/scan-engine/**
  - java/sources/**
  - java/core-domain/src/main/java/com/feipi/session/browser/domain/normalized/**
  - java/normalization-engine/**
  - java/artifact-normalized/**
  - java/index-sqlite/**
  - tests/fixtures/session_samples/**
  - scripts/checks/**
