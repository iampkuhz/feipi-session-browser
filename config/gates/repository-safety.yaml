gates:
- name: ignoredTrackedFiles
  description: 阻止被 Git 忽略的文件同时进入 tracked index。
  targets:
  - name: python-standard
    order: 90
    patterns:
    - .gitignore
    - scripts/checks/repository/check_ignored_tracked_files.py
    - scripts/gates/**
    - config/gates.yaml
    - config/gates/**
  run:
    python-check:
      check: repository.ignored-tracked
      args:
      - --root
      - '{repo_root}'
      - --staged
      required_paths:
      - scripts/checks/repository/check_ignored_tracked_files.py
- name: misplacedGeneratedPaths
  description: 检查仓库磁盘上是否出现 manifest 禁止的生成路径。
  targets:
  - name: python-standard
    order: 7
    patterns: []
  - name: acceptance-contracts
    order: 3
    patterns: []
  - name: session-detail
    order: 11
    patterns: []
  - name: index
    order: 1
    patterns: []
  - name: java-src
    order: 11
    patterns: []
  - name: java-build
    order: 5
    patterns: []
  - name: scan-script-smoke
    order: 2
    patterns: []
  run:
    python-check:
      check: repository.misplaced-generated-paths
      args:
      - --root
      - '{repo_root}'
      required_paths:
      - harness/manifest.yaml
      - scripts/checks/repository/check_misplaced_generated_paths.py
  timeout: 30
- name: noTestSkips
  description: 阻止 Python 与 Playwright 测试新增 skip、skipif 或 fixme。
  targets:
  - name: acceptance-contracts
    order: 0
    patterns:
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - tests/playwright/playwright.config.js
    - scripts/checks/repository/check_no_test_skips.py
  - name: session-detail
    order: 1
    patterns:
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - tests/playwright/playwright.config.js
    - scripts/checks/repository/check_no_test_skips.py
  minimum_tier: quick
  run:
    python-check:
      check: repository.no-test-skips
      args: []
- name: repoStructure
  description: 检查必需维护入口存在，并阻止运行态或数据库文件进入 Git。
  targets:
  - name: python-standard
    order: 92
    patterns:
    - scripts/checks/repository/check_repo_structure.py
    - scripts/gates/**
    - scripts/openspec/**
    - config/gates.yaml
    - config/gates/**
  minimum_tier: quick
  run:
    python-check:
      check: repository.structure
      args: []
- name: repoSlimming
  description: 阻止历史标记、非桌面视口与无效兼容垫片回流仓库。
  targets:
  - name: python-standard
    order: 93
    patterns:
    - java/web/src/main/resources/static/**/*.css
    - java/web/src/main/resources/static/**/*.js
    - harness/**
    - openspec/**
    - tests/**/*.py
    - scripts/checks/repository/check_repo_slimming.py
    - tests/quality/test_repo_slimming_contract.py
  run:
    python-check:
      check: repository.repo-slimming
      args: []
- name: acceptanceContracts
  description: 检查 Acceptance Contract 文档与测试 case 映射完整一致。
  targets:
  - name: acceptance-contracts
    order: 1
    patterns:
    - docs/acceptance-contracts/**/*.md
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - scripts/checks/repository/check_acceptance_contracts.py
    - tests/quality/test_contract_case_specs.py
    - pyproject.toml
  run:
    python-check:
      check: openspec.acceptance-contracts
      args: []
- name: noRealSessionFixtures
  description: 阻止真实 Session 内容进入测试、文档或源码 fixture。
  targets:
  - name: python-standard
    order: 94
    patterns:
    - tests/**
    - docs/**
    - java/**
    - scripts/checks/privacy/check_no_real_session_fixtures.py
  run:
    python-check:
      check: repository.no-real-session-fixtures
      args: []
  timeout: 120
- name: secretLikeContent
  description: 扫描仓库中的密钥、Token 与凭据形态内容。
  targets:
  - name: python-standard
    order: 95
    patterns:
    - tests/**
    - docs/**
    - java/**
    - .claude/**
    - .codex/**
    - .qoder/**
    - .agents/**
    - skills/**
    - harness/**
    - scripts/**
    - scripts/checks/privacy/check_secret_like_content.py
  run:
    python-check:
      check: security.secret-like-content
      args: []
  timeout: 120
