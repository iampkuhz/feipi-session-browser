gates:
- name: repositoryFilePolicy
  description: 统一检查必需入口、禁止根路径、Git 忽略规则和数据库文件边界。
  targets:
  - name: python-standard
    order: 90
    patterns:
    - .gitignore
    - harness/manifest.yaml
    - scripts/checks/repository/check_repository_file_policy.py
    - scripts/gates/**
    - config/gates.yaml
    - config/gates/**
  minimum_tier: quick
  run:
    python-check:
      check: repository.repository-file-policy
      args:
      - --root
      - '{repo_root}'
      - --all-tracked
      required_paths:
      - harness/manifest.yaml
      - scripts/checks/repository/check_repository_file_policy.py
  timeout: 30
- name: noPythonPlaywrightSkips
  description: 阻止 Python 与 Playwright 测试使用会产生 skipped 结果的 API。
  targets:
  - name: acceptance-cases
    order: 0
    patterns:
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - tests/playwright/playwright.config.js
    - scripts/checks/repository/check_no_python_playwright_skips.py
  - name: session-detail
    order: 1
    patterns:
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - tests/playwright/playwright.config.js
    - scripts/checks/repository/check_no_python_playwright_skips.py
  minimum_tier: quick
  run:
    python-check:
      check: repository.no-python-playwright-skips
      args: []
- name: currentSourcePolicy
  description: 检查源码只描述当前版本、当前 Harness、桌面视口和有效静态资源。
  targets:
  - name: python-standard
    order: 92
    patterns:
    - java/web/src/main/resources/static/**/*.css
    - java/web/src/main/resources/static/**/*.js
    - harness/**
    - tests/**/*.py
    - scripts/checks/repository/check_current_source_policy.py
    - tests/quality/test_current_source_policy.py
  run:
    python-check:
      check: repository.current-source-policy
      args: []
- name: acceptanceCaseMapping
  description: 检查验收用例表中的 ID 与自动化测试绑定完整一致。
  targets:
  - name: acceptance-cases
    order: 1
    patterns:
    - docs/acceptance-cases/**/*.md
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - java/**/src/test/java/**/*.java
    - scripts/checks/repository/check_acceptance_case_mapping.py
    - tests/checks/test_acceptance_case_mapping.py
    - pyproject.toml
  run:
    python-check:
      check: repository.acceptance-case-mapping
      args: []
- name: testDataPolicy
  description: 确保测试数据受 Git 管理、可复现，并且不依赖个人电脑或真实 Session。
  targets:
  - name: acceptance-cases
    order: 2
    patterns:
    - tests/**
    - java/**/src/test/**
    - scripts/checks/repository/check_test_data_policy.py
  - name: python-standard
    order: 93
    patterns:
    - tests/**
    - scripts/checks/repository/check_test_data_policy.py
  - name: java-src
    order: 11
    patterns:
    - java/**/src/test/**
  run:
    python-check:
      check: repository.test-data-policy
      args:
      - --repo-root
      - '{repo_root}'
      required_paths:
      - scripts/checks/repository/check_test_data_policy.py
  timeout: 120
- name: secretLikeContent
  description: 扫描仓库中的密钥、Token 与凭据形态内容。
  targets:
  - name: python-standard
    order: 95
    patterns:
    - tests/**
    - docs/**
    - java/**
    - .claude/**
    - .codex/**
    - .qoder/**
    - .agents/**
    - skills/**
    - harness/**
    - scripts/**
    - scripts/checks/privacy/check_secret_like_content.py
  run:
    python-check:
      check: security.secret-like-content
      args: []
  timeout: 120
