gates:
- name: repositoryFilePolicy
  description: 统一检查必需入口、禁止根路径、Git 忽略规则和数据库文件边界。
  trigger:
    mode: changed
    paths:
    - .gitignore
    - harness/manifest.yaml
    - scripts/checks/repository/check_repository_file_policy.py
    - scripts/gates/**
    - config/gates.yaml
    - config/gates/**
  targets:
  - python-standard
  run:
    kind: python-check
    incremental:
      id: repository.repository-file-policy
      args:
      - --root
      - '{repo_root}'
      - --all-tracked
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: noPythonPlaywrightSkips
  description: 阻止 Python 与 Playwright 测试使用会产生 skipped 结果的 API。
  trigger:
    mode: changed
    paths:
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - tests/playwright/playwright.config.js
    - scripts/checks/repository/check_no_python_playwright_skips.py
  targets:
  - session-detail
  run:
    kind: python-check
    incremental:
      id: repository.no-python-playwright-skips
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: currentSourcePolicy
  description: 检查源码只描述当前版本、当前 Harness、桌面视口和有效静态资源。
  trigger:
    mode: changed
    paths:
    - java/web/src/main/resources/static/**/*.css
    - java/web/src/main/resources/static/**/*.js
    - harness/**
    - tests/**/*.py
    - scripts/checks/repository/check_current_source_policy.py
    - tests/quality/test_current_source_policy.py
  targets:
  - python-standard
  run:
    kind: python-check
    incremental:
      id: repository.current-source-policy
      target_seconds: 10
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 20
      timeout_seconds: 120
- name: acceptanceCaseMapping
  description: 检查验收用例表中的 ID 与自动化测试绑定完整一致。
  trigger:
    mode: changed
    paths:
    - docs/acceptance-cases/**/*.md
    - tests/**/*.py
    - tests/**/*.js
    - tests/**/*.ts
    - java/**/src/test/java/**/*.java
    - scripts/checks/repository/check_acceptance_case_mapping.py
    - tests/checks/test_acceptance_case_mapping.py
    - pyproject.toml
  run:
    kind: python-check
    incremental:
      id: repository.acceptance-case-mapping
      target_seconds: 15
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 30
      timeout_seconds: 120
- name: testDataPolicy
  description: 确保测试数据受 Git 管理、可复现，并且不依赖个人电脑或真实 Session。
  trigger:
    mode: changed
    paths:
    - tests/**
    - java/**/src/test/**
    - scripts/checks/repository/check_test_data_policy.py
  targets:
  - python-standard
  - java-src
  run:
    kind: python-check
    incremental:
      id: repository.test-data-policy
      args:
      - --repo-root
      - '{repo_root}'
      target_seconds: 15
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 30
      timeout_seconds: 120
- name: secretLikeContent
  description: 扫描仓库中的密钥、Token 与凭据形态内容。
  trigger:
    mode: changed
    paths:
    - tests/**
    - docs/**
    - java/**
    - .claude/**
    - .codex/**
    - .qoder/**
    - .agents/**
    - skills/**
    - harness/**
    - scripts/**
    - scripts/checks/privacy/check_secret_like_content.py
  targets:
  - python-standard
  run:
    kind: python-check
    incremental:
      id: security.secret-like-content
      target_seconds: 20
      timeout_seconds: 90
    full:
      same_as: incremental
      target_seconds: 45
      timeout_seconds: 180
