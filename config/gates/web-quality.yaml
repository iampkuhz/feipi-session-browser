- catalog_order: 330
  name: browserLayout
  description: 用 Playwright 验证主要页面、布局与视觉壳层契约。
  targets:
  - name: session-detail
    order: 9
    patterns:
    - java/web/src/main/resources/templates/**
    - java/web/src/main/resources/static/**
    - tests/playwright/**
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: playwright
    argv:
    - npm
    - --prefix
    - tests/playwright
    - test
    - --
    - ui-contract.spec.ts
    - main-pages-visual.spec.ts
    - session-detail-layout
    - shell-states
    - dashboard-chart-coordinates
    - --workers={playwright_workers}
    required_paths:
    - tests/playwright
    - tests/playwright/playwright.config.js
    - tests/playwright/package.json
    - tests/playwright/node_modules
- catalog_order: 340
  name: browserInteraction
  description: 用 Playwright 验证 Session、列表与迁移页面交互。
  targets:
  - name: session-detail
    order: 10
    patterns:
    - java/web/src/main/resources/templates/**
    - java/web/src/main/resources/static/**
    - tests/playwright/**
  tiers:
  - required
  - full
  timeout: 300
  incremental: patterns
  changed_files: none
  included_by: []
  command:
    capability: playwright
    argv:
    - npm
    - --prefix
    - tests/playwright
    - test
    - --
    - session-detail.spec.js
    - session-detail-migrated-gates.spec.js
    - sessions-list.spec.js
    - --grep-invert
    - 100 轮
    - --workers={playwright_workers}
    required_paths:
    - tests/playwright
    - tests/playwright/playwright.config.js
    - tests/playwright/package.json
    - tests/playwright/node_modules
