gates:
- name: languagePolicy
  description: 检查仓库规则、Skill 与 Harness 文本符合中文语言政策。
  trigger:
    mode: changed
    paths:
    - AGENTS.md
    - CLAUDE.md
    - skills/**
    - .agents/skills/**
    - .codex/**
    - .claude/agents/**
    - .claude/skills/**
    - .qoder/**
    - harness/**
    - openspec/changes/**
    - scripts/checks/source/check_language_policy.py
  targets:
  - harness
  run:
    kind: python-check
    incremental:
      id: repository.language-policy
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: protectedRootsSync
  description: 检查各 Agent 入口声明的受保护路径与共享政策一致。
  trigger:
    mode: changed
    paths:
    - AGENTS.md
    - CLAUDE.md
    - .agents/**
    - .claude/**
    - .codex/**
    - .qoder/**
    - skills/**
    - harness/**
    - scripts/harness/**/*.py
    - scripts/harness/**/*.sh
    - scripts/checks/**/*.py
    - scripts/gates/**/*.py
    - config/gates.yaml
    - config/gates/**
  targets:
  - harness
  run:
    kind: python-check
    incremental:
      id: agent.protected-roots
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: subagentHandoffProtocol
  description: 检查 subagent handoff 字段、状态和失败策略在各入口保持一致。
  trigger:
    mode: changed
    paths:
    - AGENTS.md
    - CLAUDE.md
    - .agents/**
    - .claude/**
    - .codex/**
    - .qoder/**
    - skills/**
    - harness/**
    - scripts/harness/**/*.py
    - scripts/harness/**/*.sh
    - scripts/checks/**/*.py
    - scripts/gates/**/*.py
    - config/gates.yaml
    - config/gates/**
  targets:
  - harness
  run:
    kind: python-check
    incremental:
      id: agent.subagent-handoff
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: doctor
  description: 只读检查 Harness 依赖、结构与配置是否可用。
  trigger:
    mode: changed
    paths:
    - scripts/harness/**/*.sh
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - bash
      - scripts/harness/doctor.sh
      target_seconds: 15
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 30
      timeout_seconds: 120
- name: agentPolicySize
  description: 限制 Agent 入口与共享政策体积，防止规则重新膨胀。
  trigger:
    mode: changed
    paths:
    - AGENTS.md
    - CLAUDE.md
    - .codex/config.toml
    - harness/agent-policy.manifest.yaml
    - scripts/checks/agent/check_agent_policy_size.py
  targets:
  - harness
  run:
    kind: python-check
    incremental:
      id: agent.policy-size
      target_seconds: 5
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 10
      timeout_seconds: 60
- name: skillRegistry
  description: 检查共享 Skill registry、平台入口与物理目录一致。
  trigger:
    mode: changed
    paths:
    - harness/skill-registry.yaml
    - skills/**
    - .agents/skills/**
    - .claude/skills/**
    - .codex/skills/**
    - scripts/checks/agent/check_skill_registry.py
  targets:
  - harness
  run:
    kind: python-check
    incremental:
      id: agent.skill-registry
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: harnessStructure
  description: 验证 Harness manifest、Skill 链接和目录结构契约。
  trigger:
    mode: changed
    paths:
    - harness/**
    - scripts/harness/**/*.py
  targets:
  - harness
  run:
    kind: command
    incremental:
      argv:
      - '{python}'
      - scripts/harness/validate_harness_structure.py
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
- name: openspecLayout
  description: 验证 OpenSpec 目录布局和必需文件。
  trigger:
    mode: changed
    paths:
    - openspec/**
  targets:
  - harness
  run:
    kind: command
    incremental:
      argv:
      - '{python}'
      - scripts/openspec/validate_layout.py
      target_seconds: 8
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 15
      timeout_seconds: 60
