gates:
- name: javaCheck
  description: 运行 Java 模块编译、单元测试与标准 Gradle 检查。
  trigger:
    mode: changed
    paths:
    - java/**/src/main/java/**/*.java
    - java/**/src/test/java/**/*.java
    - '**/*.java'
    - config/api-snapshots/java-public-api.txt
    - config/architecture/java-modules.yaml
    - gradle/build-logic/**
    - gradle/**
    - build.gradle.kts
    - settings.gradle.kts
    - java/**/build.gradle.kts
    - gradle.properties
    - gradlew
    - gradlew.bat
    - '*.lockfile'
  targets:
  - java-src
  - java-build
  run:
    kind: gradle-task
    incremental:
      tasks:
      - check
      args:
      - -x
      - checkstyleMain
      - -x
      - checkstyleTest
      - -x
      - javadoc
      - --parallel
      - --build-cache
      target_seconds: 240
      timeout_seconds: 900
    full:
      same_as: incremental
      target_seconds: 600
      timeout_seconds: 1800
- name: javaChineseComments
  description: 检查 Java、Kotlin 与 Gradle 注释符合中文和术语政策。
  trigger:
    mode: changed
    paths:
    - java/**/src/main/java/**/*.java
    - java/**/src/test/java/**/*.java
    - java/**/src/main/kotlin/**/*.kt
    - java/**/src/test/kotlin/**/*.kt
    - '**/*.java'
    - config/technical-terms.json
    - gradle/build-logic/**/*.java
    - gradle/build-logic/**/*.kt
    - gradle/build-logic/**/*.kts
    - build.gradle.kts
    - settings.gradle.kts
    - java/**/build.gradle.kts
  targets:
  - java-src
  - java-build
  run:
    kind: java-rule
    incremental:
      rules:
      - java-comment-language
      target_seconds: 60
      timeout_seconds: 300
    full:
      same_as: incremental
      target_seconds: 180
      timeout_seconds: 900
- name: javaRecordComponentJavadocs
  description: 检查公开 record component 具有匹配的 Javadoc 参数说明。
  trigger:
    mode: changed
    paths:
    - java/**/src/main/java/**/*.java
    - '**/*.java'
  targets:
  - java-src
  run:
    kind: java-rule
    incremental:
      rules:
      - record-component-javadocs
      target_seconds: 45
      timeout_seconds: 180
    full:
      same_as: incremental
      target_seconds: 120
      timeout_seconds: 600
- name: noJavaTestSkips
  description: 阻止 Java 测试出现 skipped 或 aborted 结果。
  trigger:
    mode: changed
    paths:
    - java/**/src/test/java/**/*.java
  targets:
  - java-src
  run:
    kind: gradle-task
    incremental:
      tasks:
      - verifyNoSkippedJavaTests
      target_seconds: 30
      timeout_seconds: 180
    full:
      same_as: incremental
      target_seconds: 90
      timeout_seconds: 600
- name: noJavaSuppressWarnings
  description: 阻止 Java 生产源码新增 PMD 抑制注解。
  trigger:
    mode: changed
    paths:
    - java/**/src/main/java/**/*.java
  targets:
  - java-src
  run:
    kind: java-rule
    incremental:
      rules:
      - no-pmd-suppressions
      target_seconds: 45
      timeout_seconds: 180
    full:
      same_as: incremental
      target_seconds: 120
      timeout_seconds: 600
- name: reuseStandardCpd
  description: 按共享复用政策执行 Java CPD 重复代码检查。
  trigger:
    mode: changed
    paths:
    - java/**/src/main/java/**/*.java
    - config/reuse-policy/**
    - java/**/build.gradle.kts
    - settings.gradle.kts
    - build.gradle.kts
  targets:
  - java-src
  - java-build
  run:
    kind: gradle-task
    incremental:
      tasks:
      - reuseStandardCpd
      target_seconds: 120
      timeout_seconds: 600
    full:
      same_as: incremental
      target_seconds: 420
      timeout_seconds: 1200
- name: reuseAnalyzeIncremental
  description: 生成 Java 增量复用分析证据并检查政策变更。
  trigger:
    mode: changed
    paths:
    - java/**/src/main/java/**/*.java
    - config/reuse-policy/**
    - java/**/build.gradle.kts
    - settings.gradle.kts
    - build.gradle.kts
  targets:
  - java-src
  - java-build
  run:
    kind: gradle-task
    incremental:
      tasks:
      - reuseAnalyzeIncremental
      target_seconds: 120
      timeout_seconds: 600
    full:
      same_as: incremental
      target_seconds: 420
      timeout_seconds: 1200
- name: javaApiSnapshot
  description: 比较公开 Java API 与受控快照，防止未审阅的兼容变化。
  trigger:
    mode: changed
    paths:
    - config/api-snapshots/java-public-api.txt
    - java/**/src/main/java/**/*.java
  targets:
  - java-src
  - java-build
  run:
    kind: java-rule
    incremental:
      rules:
      - java-api-snapshot
      target_seconds: 90
      timeout_seconds: 300
    full:
      same_as: incremental
      target_seconds: 240
      timeout_seconds: 1200
