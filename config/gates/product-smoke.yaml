gates:
- name: indexIntegrity
  description: 检查本地 Session 索引文件、表结构与关键字段完整性。
  targets:
  - name: index
    order: 0
    patterns:
    - scripts/checks/repository/check_index_integrity.py
  run:
    python-check:
      check: repository.index-integrity
      args: []
  timeout: 120
- name: scanScriptSmoke
  description: 验证 session-browser scan 命令与发行 CLI 的进程级契约。
  targets:
  - name: scan-script-smoke
    order: 0
    patterns:
    - scripts/session-browser.sh
    - java/app-cli/**
    - java/scan-engine/**
    - java/sources/**
    - java/index-sqlite/**
    - scripts/checks/**
    - tests/script_commands/**
  run:
    scan-smoke:
      argv:
      - '{dev_python}'
      - -m
      - pytest
      - -q
      - -W
      - error
      - '{repo_root}/tests/script_commands/test_session_browser_scan_smoke.py'
      required_paths:
      - gradlew
      - tests/script_commands/test_session_browser_scan_smoke.py
      prerequisite_tasks:
      - :java:app-cli:installDist
- name: sessionSamples
  description: 用合成 Session 样本验证解析、标准化与契约集成。
  targets:
  - name: scan-script-smoke
    order: 1
    patterns:
    - tests/fixtures/session_samples/**
    - java/core-domain/src/main/java/com/feipi/session/browser/domain/normalized/**
    - java/sources/**
    - java/normalization-engine/**
    - java/artifact-normalized/**
    - java/tests/contracts/src/test/java/com/feipi/session/browser/contracttest/sample/**
  run:
    gradle-task:
      tasks:
      - :java:tests:contracts:sampleIntegrationTest
