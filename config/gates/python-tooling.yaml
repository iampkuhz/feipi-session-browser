gates:
- name: pythonFormat
  description: 校验仓库 Python 源码符合 Ruff 格式化结果。
  targets:
  - name: python-standard
    order: 0
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  run:
    command:
      argv:
      - '{dev_python}'
      - -m
      - ruff
      - format
      - --check
      - .
- name: pythonLint
  description: 检查 Python 静态问题与 import 顺序。
  targets:
  - name: python-standard
    order: 1
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  run:
    command:
      argv:
      - '{dev_python}'
      - -m
      - ruff
      - check
      - --extend-select
      - I
      - .
- name: pythonHarnessTests
  description: 运行 Harness、Gate 与质量契约的固定 Pytest 单测集合。
  targets:
  - name: python-standard
    order: 2
    patterns:
    - pyproject.toml
    - config/gates.yaml
    - config/gates/**
    - scripts/gates/**/*.py
    - scripts/checks/**/*.py
    - scripts/harness/**/*.py
    - scripts/openspec/**/*.py
    - tests/gates/**/*.py
    - tests/checks/**/*.py
    - tests/harness/**/*.py
    - tests/misc/**/*.py
    - tests/quality/**/*.py
    - tests/*.py
  run:
    command:
      argv:
      - '{dev_python}'
      - -m
      - pytest
      - -W
      - error
      - tests/harness
      - tests/gates
      - tests/checks
      - tests/quality
      - tests/misc
      glob_args:
      - tests/test_*.py
      required_paths:
      - tests/harness
      - tests/gates
      - tests/checks
      - tests/quality
      - tests/misc
- name: pythonSourceSecurity
  description: 使用 Bandit 对 scripts Python 源码执行离线安全扫描。
  targets:
  - name: python-standard
    order: 3
    patterns:
    - pyproject.toml
    - scripts/**/*.py
  run:
    command:
      argv:
      - '{dev_python}'
      - -m
      - bandit
      - -q
      - -c
      - pyproject.toml
      - -r
      - scripts
      - --severity-level
      - high
- name: pythonDependencyVulnerabilities
  description: 审计 Python 锁定依赖中的已知漏洞。
  targets:
  - name: python-standard
    order: 4
    patterns:
    - pyproject.toml
    - uv.lock
  minimum_tier: full
  network_failure: blocked
  run:
    python-check:
      check: repository.python-dependency-vulnerabilities
      python: dev
      args:
      - --root
      - '{repo_root}'
      required_paths:
      - scripts/checks/repository/check_python_dependency_vulnerabilities.py
- name: pythonDeadCode
  description: 检查 scripts 与测试中的高置信度无引用 Python 代码。
  targets:
  - name: python-standard
    order: 5
    patterns:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  run:
    command:
      argv:
      - '{dev_python}'
      - -m
      - vulture
- name: pythonDependencyDeclarations
  description: 检查 scripts 的 Python 依赖声明完整性。
  targets:
  - name: python-standard
    order: 6
    patterns:
    - pyproject.toml
    - scripts/**/*.py
  run:
    command:
      argv:
      - '{dev_python}'
      - -m
      - deptry
      - scripts
- name: bashSyntax
  description: 使用 bash 语法解析器检查仓库 Shell 脚本。
  targets:
  - name: python-standard
    order: 91
    patterns:
    - scripts/**/*.sh
  minimum_tier: quick
  run:
    command:
      argv:
      - bash
      - -n
      glob_args:
      - scripts/**/*.sh
- name: scriptCommentLanguage
  description: 检查 Python、Shell 注释语言与技术术语符合中文维护规范。
  targets:
  - name: python-standard
    order: 8
    patterns:
    - scripts/**/*.py
    - scripts/**/*.sh
  - name: java-build
    order: 6
    patterns:
    - config/technical-terms.json
  run:
    python-check:
      check: source.comment-language
      args:
      - scripts
      required_paths:
      - scripts/checks/source/check_code_comment_language.py
      optional_args:
      - path: config/technical-terms.json
        argv:
        - --policy
        - '{repo_root}/config/technical-terms.json'
