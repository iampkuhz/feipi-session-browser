gates:
- name: pythonFormat
  description: 校验仓库 Python 源码符合 Ruff 格式化结果。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - '{dev_python}'
      - -m
      - ruff
      - format
      - --check
      - .
      target_seconds: 10
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 20
      timeout_seconds: 120
- name: pythonLint
  description: 检查 Python 静态问题与 import 顺序。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - '{dev_python}'
      - -m
      - ruff
      - check
      - --extend-select
      - I
      - .
      target_seconds: 15
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 30
      timeout_seconds: 120
- name: pythonHarnessTests
  description: 运行 Harness、Gate 与质量契约的固定 Pytest 单测集合。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - config/gates.yaml
    - config/gates/**
    - scripts/gates/**/*.py
    - scripts/checks/**/*.py
    - scripts/harness/**/*.py
    - scripts/openspec/**/*.py
    - tests/gates/**/*.py
    - tests/checks/**/*.py
    - tests/harness/**/*.py
    - tests/misc/**/*.py
    - tests/quality/**/*.py
    - tests/*.py
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - '{dev_python}'
      - -m
      - pytest
      - -W
      - error
      - tests/harness
      - tests/gates
      - tests/checks
      - tests/quality
      - tests/misc
      required_paths:
      - tests/harness
      - tests/gates
      - tests/checks
      - tests/quality
      - tests/misc
      append_globs:
      - tests/test_*.py
      target_seconds: 60
      timeout_seconds: 240
    full:
      same_as: incremental
      target_seconds: 180
      timeout_seconds: 600
- name: pythonSourceSecurity
  description: 使用 Bandit 对 scripts Python 源码执行离线安全扫描。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - scripts/**/*.py
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - '{dev_python}'
      - -m
      - bandit
      - -q
      - -c
      - pyproject.toml
      - -r
      - scripts
      - --severity-level
      - high
      target_seconds: 20
      timeout_seconds: 90
    full:
      same_as: incremental
      target_seconds: 45
      timeout_seconds: 180
- name: pythonDependencyVulnerabilities
  description: 审计 Python 锁定依赖中的已知漏洞。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - uv.lock
  targets:
  - python-standard
  run:
    kind: python-check
    incremental:
      id: repository.python-dependency-vulnerabilities
      runtime: dev
      args:
      - --root
      - '{repo_root}'
      target_seconds: 60
      timeout_seconds: 180
    full:
      same_as: incremental
      target_seconds: 120
      timeout_seconds: 360
- name: pythonDeadCode
  description: 检查 scripts 与测试中的高置信度无引用 Python 代码。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - scripts/**/*.py
    - tests/**/*.py
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - '{dev_python}'
      - -m
      - vulture
      target_seconds: 15
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 30
      timeout_seconds: 120
- name: pythonDependencyDeclarations
  description: 检查 scripts 的 Python 依赖声明完整性。
  trigger:
    mode: changed
    paths:
    - pyproject.toml
    - scripts/**/*.py
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - '{dev_python}'
      - -m
      - deptry
      - scripts
      target_seconds: 15
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 30
      timeout_seconds: 120
- name: bashSyntax
  description: 使用 bash 语法解析器检查仓库 Shell 脚本。
  trigger:
    mode: changed
    paths:
    - scripts/**/*.sh
  targets:
  - python-standard
  run:
    kind: command
    incremental:
      argv:
      - bash
      - -n
      append_globs:
      - scripts/**/*.sh
      target_seconds: 5
      timeout_seconds: 30
    full:
      same_as: incremental
      target_seconds: 10
      timeout_seconds: 60
- name: scriptCommentLanguage
  description: 检查 Python、Shell 注释语言与技术术语符合中文维护规范。
  trigger:
    mode: changed
    paths:
    - scripts/**/*.py
    - scripts/**/*.sh
    - config/technical-terms.json
  targets:
  - python-standard
  - java-build
  run:
    kind: python-check
    incremental:
      id: source.comment-language
      args:
      - scripts
      - --policy
      - '{repo_root}/config/technical-terms.json'
      target_seconds: 10
      timeout_seconds: 60
    full:
      same_as: incremental
      target_seconds: 20
      timeout_seconds: 120
