name: Distribution

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
    outputs:
      candidate-id:
        value: ${{ jobs.build.outputs.candidate-id }}
      candidate-key:
        value: ${{ jobs.build.outputs.candidate-key }}

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      full-mode: true
  build:
    needs: quality
    runs-on: macos-15
    outputs:
      candidate-id: ${{ steps.seal.outputs.artifact-id }}
      candidate-key: ${{ format('{0}:{1}:{2}', github.sha, github.run_id, github.run_attempt) }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up native arm64 JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          architecture: arm64
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
          build-scan-publish: false
      - name: Check macOS arm64, JDK 25 and source version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_CODE'
          import os, pathlib, platform, re, subprocess
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64'
          result = subprocess.run(['java', '-XshowSettings:properties', '-version'], capture_output=True, text=True, check=True)
          assert re.search(r'java.version = 25(?:[.\s+]|$)', result.stderr)
          assert re.search(r'os.arch = (aarch64|arm64)\b', result.stderr)
          version = pathlib.Path('java/gradle/VERSION').read_text().strip()
          assert not os.environ['REQUESTED_VERSION'] or version == os.environ['REQUESTED_VERSION']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VERSION=' + version + '\n')
          PYTHON_CODE
      - name: Check and build the macOS arm64 runtime
        run: ./java/gradlew -p java check :java:app-cli:runtimeDistTar --continue --no-daemon
      - name: Prepare and launch actual native archive without external JDK
        run: |
          set -euo pipefail
          python3 scripts/release/release_pipeline_helpers.py prepare --dist-dir java/app-cli/build/distributions --output-dir verified-candidate --version "$VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload the sole verified candidate
        id: seal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
