# Java 发行 release workflow
# 触发方式：push tag v* 或 workflow_dispatch（手动/RC）
# 产物：四平台未签名 distribution + checksum
# 失败策略：任一阶段失败不发布 partial release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，不带 v 前缀（例如 0.4 或 0.4.1-rc.1）"
        required: true
      publish:
        description: "创建 GitHub Release；false 时只构建验证不发布"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================
  # 阶段 1：版本解析与前置校验
  # 校验位于 CI 入口 trust boundary：tag/ref 与 VERSION 文件一致性。
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 解析版本与发布模式
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          file_version="$(tr -d '[:space:]' < java/gradle/VERSION)"
          publish="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?|[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?)$ ]]; then
              echo "::error::非法发布 tag：$tag。请使用发布 tag vX.Y 或 vX.Y.Z，例如 v0.4 或 v0.4.1-rc.1" >&2
              exit 1
            fi
            version="${tag#v}"
            publish="true"
          else
            version="${INPUT_VERSION}"
            if [[ ! "$version" =~ ^([0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?|[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?)$ ]]; then
              echo "::error::非法发布版本：$version。请使用发布版本 X.Y 或 X.Y.Z，例如 0.4 或 0.4.1-rc.1" >&2
              exit 1
            fi
            if [[ "${INPUT_PUBLISH}" == "true" ]]; then
              if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
                echo "::error::workflow_dispatch publish=true 必须在 v${version} tag ref 上运行。" >&2
                exit 1
              fi
              publish="true"
            fi
          fi

          # VERSION 文件是唯一真源，必须与发布版本一致
          if [[ "$version" == *..* ]]; then
            echo "::error::发布版本不能包含连续的点。" >&2
            exit 1
          fi
          if [[ "$file_version" != "$version" ]]; then
            echo "::error::VERSION($file_version) 与发布版本($version)不一致。请先更新 VERSION 文件。" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "发布版本: $version, 正式发布: $publish"

  distribution:
    needs: validate
    uses: ./.github/workflows/distribution.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  release-candidate:
    needs: [validate, distribution]
    runs-on: ubuntu-24.04
    environment:
      name: release-candidate
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record the sealed artifact from this distribution invocation
        shell: bash
        env:
          CANDIDATE_ID: ${{ needs.distribution.outputs.candidate-id }}
          CANDIDATE_KEY: ${{ needs.distribution.outputs.candidate-key }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_ID" =~ ^[1-9][0-9]*$ || "$CANDIDATE_KEY" != "$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" ]]; then
            echo "::error::候选缺失或不属于当前源码、运行与尝试。" >&2
            exit 1
          fi
          printf 'Verified candidate artifact ID: %s\n' "$CANDIDATE_ID"

  publish-release:
    needs: [validate, distribution, release-candidate]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-version-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    environment:
      name: github-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.validate.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject a missing or stale candidate before download
        shell: bash
        env:
          CANDIDATE_ID: ${{ needs.distribution.outputs.candidate-id }}
          CANDIDATE_KEY: ${{ needs.distribution.outputs.candidate-key }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_ID" =~ ^[1-9][0-9]*$ || "$CANDIDATE_KEY" != "$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" ]]; then
            echo "::error::候选缺失或不属于当前源码、运行与尝试。" >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download only the verified candidate from this run and attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.distribution.outputs.candidate-id }}
          merge-multiple: true
          path: verified-candidate/
      - name: Verify candidate again after manual approval
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/release/release_pipeline_helpers.py verify-candidate --candidate-dir verified-candidate --version "$VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Verify existing remote tag still targets the exact approved SHA
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "v$VERSION" ]]
          [[ "$(tr -d '[:space:]' < java/gradle/VERSION)" == "$VERSION" ]]
          # gh supplies authentication without persisting a write token in checkout.
          gh auth setup-git
          remote_refs="$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}")"
          remote_sha="$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(printf '%s\n' "$remote_refs" | awk 'NF == 2 {print $1}')"
          fi
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
      - name: Create draft, upload and redownload every asset, then make public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON_CODE'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          api = os.environ['GITHUB_API_URL']
          repository = os.environ['GITHUB_REPOSITORY']
          tag = 'v' + os.environ['VERSION']
          root = api + '/repos/' + repository
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}

          class ReleaseRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, response_headers, newurl)
                  if redirected is not None:
                      def origin(url):
                          parsed = urllib.parse.urlsplit(url)
                          port = parsed.port or (443 if parsed.scheme == 'https' else 80)
                          return parsed.scheme.lower(), parsed.hostname, port
                      if origin(req.full_url) != origin(newurl):
                          redirected.remove_header('Authorization')
                  return redirected

          opener = urllib.request.build_opener(ReleaseRedirectHandler())

          def request(url, method='GET', payload=None, binary=False):
              current_headers = dict(headers)
              if binary:
                  current_headers['Accept'] = 'application/octet-stream'
              data = None
              if isinstance(payload, bytes):
                  data = payload
                  current_headers['Content-Type'] = 'application/octet-stream'
              elif payload is not None:
                  data = json.dumps(payload).encode()
                  current_headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=current_headers, method=method)
              with opener.open(req, timeout=180) as response:
                  body = response.read()
              return body if binary else json.loads(body)

          # A foreign or public release is never overwritten. Even an old draft
          # requires explicit human recovery rather than silent asset clobbering.
          page = 1
          while True:
              existing = request(root + '/releases?per_page=100&page=' + str(page))
              if any(item['tag_name'] == tag for item in existing):
                  raise RuntimeError('Release or draft already exists; refusing to overwrite ' + tag)
              if len(existing) < 100:
                  break
              page += 1
          assets = {path.name: path.read_bytes() for path in Path('verified-candidate').iterdir() if path.is_file()}
          if len(assets) != 15:
              raise RuntimeError('Expected all 15 verified candidate assets')
          notes = Path('docs/release/notes') / (tag + '.md')
          # Only pure numeric X.Y / X.Y.Z versions are stable and eligible for latest.
          prerelease = re.fullmatch(r'[0-9]+\.[0-9]+(?:\.[0-9]+)?', os.environ['VERSION']) is None
          payload = {'tag_name': tag, 'target_commitish': os.environ['GITHUB_SHA'], 'name': tag, 'draft': True, 'prerelease': prerelease, 'make_latest': 'false' if prerelease else 'true'}
          if notes.is_file():
              payload['body'] = notes.read_text()
          else:
              payload['generate_release_notes'] = True
          release = request(root + '/releases', 'POST', payload)
          release_url = root + '/releases/' + str(release['id'])
          print('Created non-public draft: ' + release['html_url'], flush=True)
          upload_url = release['upload_url'].split('{', 1)[0]
          for name, data in sorted(assets.items()):
              request(upload_url + '?name=' + urllib.parse.quote(name, safe=''), 'POST', data)
          remote = request(release_url)
          if remote['draft'] is not True or remote['tag_name'] != tag:
              raise RuntimeError('Draft identity or visibility changed')
          remote_assets = request(release_url + '/assets?per_page=100')
          if len(remote_assets) != len(assets) or {asset['name'] for asset in remote_assets} != set(assets):
              raise RuntimeError('Remote asset names do not exactly match verified candidate')
          for asset in remote_assets:
              expected = assets[asset['name']]
              downloaded = request(asset['url'], binary=True)
              if asset['size'] != len(expected) or len(downloaded) != len(expected) or hashlib.sha256(downloaded).digest() != hashlib.sha256(expected).digest():
                  raise RuntimeError('Remote size/hash mismatch: ' + asset['name'])
          # Only this final operation exposes the already complete draft.
          published = request(release_url, 'PATCH', {'draft': False})
          if published['draft'] is not False:
              raise RuntimeError('Release did not become public')
          print('Published verified release: ' + published['html_url'])
          PYTHON_CODE
