# macOS arm64 Java 产品验证；统一 Gate receipt 由 quality.yml 负责。
name: Java Quality

on:
  push:
    branches: [main, main_java]
    paths:
      - 'java/**'
      - 'java/gradle/build-logic/**'
      - 'java/gradle/**'
      - 'java/gradle.properties'
      - 'java/build.gradle.kts'
      - 'java/settings.gradle.kts'
      - 'scripts/gates/checks/**'
      - 'scripts/gates/config/technical-terms.json'
      - '.github/workflows/java-quality.yml'
  pull_request:
    paths:
      - 'java/**'
      - 'java/gradle/build-logic/**'
      - 'java/gradle/**'
      - 'java/gradle.properties'
      - 'java/build.gradle.kts'
      - 'java/settings.gradle.kts'
      - 'scripts/gates/checks/**'
      - 'scripts/gates/config/technical-terms.json'
      - '.github/workflows/java-quality.yml'
  workflow_dispatch:

concurrency:
  group: java-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-full:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up native arm64 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          architecture: arm64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/main_java' }}
          build-scan-publish: false

      - name: Check native macOS arm64 host
        run: test "$(uname -sm)" = 'Darwin arm64'

      - name: qualityFull
        run: ./java/gradlew -p java qualityFull

      - name: Check development launcher
        run: |
          ./java/gradlew -p java :java:app-cli:installDist
          ./java/app-cli/build/install/app-cli/bin/app-cli --help
          ./java/app-cli/build/install/app-cli/bin/app-cli --version

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/
          retention-days: 7
          if-no-files-found: warn
