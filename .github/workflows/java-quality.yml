# 按需生成 Java 专项报告；自动验证与统一 Gate receipt 由 quality.yml 负责。
name: Java Quality

on:
  workflow_dispatch:

concurrency:
  group: java-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-full:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up native arm64 JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
          architecture: arm64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          build-scan-publish: false

      - name: Check native macOS arm64 host
        run: test "$(uname -sm)" = 'Darwin arm64'

      - name: qualityFull
        run: ./java/gradlew -p java qualityFull

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/
          retention-days: 7
          if-no-files-found: warn
