# CI 和 Release 共用相同质量门、构建与候选验收链。
name: CI Distribution
on:
  push:
    branches: [main, main_java]
    paths: &distribution-paths
      - 'java/**'
      - 'scripts/release/**'
      - '.github/workflows/distribution.yml'
      - '.github/workflows/ci-distribution.yml'
      - '.github/workflows/quality.yml'
  pull_request:
    paths: *distribution-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-dist-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    uses: ./.github/workflows/distribution.yml
