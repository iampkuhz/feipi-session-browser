name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-mode:
        description: "'publish' for a protected release, 'candidate' for a dry run, empty for standalone Quality"
        type: string
        default: ''
    outputs:
      candidate-id:
        value: ${{ jobs.quality.outputs.candidate-id }}
      candidate-key:
        value: ${{ jobs.quality.outputs.candidate-key }}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ inputs.release-mode && 'Gate and verified package' || 'quality' }}
    runs-on: macos-15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright-browsers
    outputs:
      candidate-id: ${{ steps.seal.outputs.artifact-id }}
      candidate-key: ${{ steps.review.outputs.candidate-key }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select one Gate mode
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF_TYPE" != tag ]] &&
             git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null &&
             ! git diff --quiet "$BASE_SHA" HEAD -- &&
             git diff --quiet --no-renames "$BASE_SHA" HEAD -- java/ scripts/release/ \
               .github/workflows/quality.yml .github/workflows/release.yml; then
            mode=incremental
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "GATE_MODE=$mode" >> "$GITHUB_ENV"

      - name: Check native macOS arm64 host
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          sysctl hw.logicalcpu hw.memsize

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          architecture: arm64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          build-scan-publish: false
          add-job-summary: ${{ inputs.release-mode && 'never' || 'always' }}

      - name: Verify dependency lock
        run: uv lock --project scripts --check

      - name: Install dependencies
        run: UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.local/python/venv" uv sync --project scripts --frozen --extra dev

      - name: Set up Node.js 24 for Playwright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: arm64
          package-manager-cache: false

      - name: Install Playwright dependencies
        run: npm ci --prefix java/tests/playwright

      - name: Install locked Playwright Chromium
        working-directory: java/tests/playwright
        run: npx playwright install chromium

      - name: Prepare empty ignored OpenSpec workspace for a fresh checkout
        run: mkdir -p openspec/changes

      - name: Unified quality gates
        shell: bash
        run: |
          if [[ "$GATE_MODE" == "full" ]]; then
            python3 scripts/gates/cli.py run --mode full
          else
            python3 scripts/gates/cli.py run --mode incremental --base "$BASE_SHA"
          fi

      - name: Require a complete successful receipt from this checkout
        id: receipt
        shell: bash
        run: |
          python3 - <<'PYTHON_CODE'
          import json
          import os
          from pathlib import Path

          root = Path('tmp/quality/runs').resolve()
          pointer = json.loads((root / 'latest.json').read_text())
          summary_path = (root / pointer['summary']).resolve()
          assert summary_path.is_relative_to(root), 'Unsafe Gate receipt pointer'
          summary = json.loads(summary_path.read_text())
          plan = json.loads(summary_path.with_name('plan.json').read_text())
          assert summary['kind'] == 'gate-run-receipt'
          assert summary['runId'] == pointer['runId']
          assert summary['status'] == 'PASS', summary['status']
          assert summary['snapshot']['head'] == os.environ['GITHUB_SHA']
          assert summary['planFingerprint'] == plan['planFingerprint']
          assert summary['mode'] == plan['mode'] == os.environ['GATE_MODE']
          if plan['mode'] == 'full':
              assert plan['selector'] is None
              expected = {gate['gate']: gate for gate in plan['gates']}
              results = summary['gateResults']
              assert expected and len(results) == len(expected)
              assert {gate['gate'] for gate in results} == set(expected)
              for gate in results:
                  assert gate['status'] == 'PASS', gate['gate']
                  steps = gate['recipeSteps']
                  names = {step['name'] for step in expected[gate['gate']]['recipeSteps']}
                  assert names and len(steps) == len(names)
                  assert {step['recipeStep'] for step in steps} == names
                  for step in steps:
                      assert step['status'] == 'PASS', step['recipeStep']
                      assert step['invocationResults'], step['recipeStep']
                      for invocation in step['invocationResults']:
                          assert invocation['status'] == 'PASS' and invocation['returnCode'] == 0
                          assert not invocation['taskFailureReasons']
          run_id = summary['runId']
          print('Verified actual Gate receipt:', run_id)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'gate-run-id={run_id}', file=output)
          PYTHON_CODE

      - name: Retain failed synthetic browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/agent-runtime/checkouts/**/playwright/test-results/**/trace.zip
            tmp/agent-runtime/checkouts/**/playwright/test-results/**/test-failed-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Build the macOS arm64 runtime
        if: steps.scope.outputs.mode == 'full'
        run: ./java/gradlew -p java :java:app-cli:runtimeDistTar --no-daemon

      - name: Prepare and launch actual native archive without external JDK
        if: steps.scope.outputs.mode == 'full'
        run: |
          set -euo pipefail
          python3 scripts/release/release_pipeline_helpers.py prepare --dist-dir java/app-cli/build/distributions --output-dir verified-candidate --version "$(cat java/gradle/VERSION)" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload the sole verified candidate
        id: seal
        if: steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Register the sealed candidate and summarize the review
        id: review
        if: steps.scope.outputs.mode == 'full' && inputs.release-mode != ''
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.release-mode }}
          CANDIDATE_ID: ${{ steps.seal.outputs.artifact-id }}
          GATE_RECEIPT: ${{ steps.receipt.outputs.gate-run-id }}
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            publish) next='Approve the protected github-release deployment to publish.' ;;
            candidate) next='Candidate verification only. This run will not publish.' ;;
            *) echo 'Invalid release mode.' >&2; exit 1 ;;
          esac
          version="$(cat java/gradle/VERSION)"
          read -r digest size archive < verified-candidate/MANIFEST.SHA256
          if [[ ! "$CANDIDATE_ID" =~ ^[1-9][0-9]*$ || -z "$GATE_RECEIPT" ||
                ! "$digest" =~ ^[0-9a-f]{64}$ || ! "$size" =~ ^[1-9][0-9]*$ ||
                "$archive" != "app-cli-$version-runtime-macos-arm64.tar.gz" ]]; then
            echo 'Missing or invalid candidate review evidence.' >&2
            exit 1
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### v$version · macOS arm64

          - Commit: \`$GITHUB_SHA\`
          - Full Gate: passed (receipt \`$GATE_RECEIPT\`)
          - Package: \`$archive\` — unpacked and launched with bundled Java
          - Package SHA-256: \`$digest\` (candidate artifact $CANDIDATE_ID)

          $next
          EOF
          printf 'candidate-key=%s:%s:%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Retain the Gate receipt for standalone Quality or release failure
        if: ${{ !cancelled() && (failure() || inputs.release-mode == '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/quality/runs/
          retention-days: 14
          if-no-files-found: warn
