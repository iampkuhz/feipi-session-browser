name: Quality

on:
  push:
    branches: [main, main_java]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true
          build-scan-publish: false

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.local/python/venv" uv sync --frozen --extra dev

      - name: Install Playwright dependencies
        run: npm ci --prefix tests/playwright

      - name: Unified quality gates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/gates/cli.py run --mode full
          else
            base="$PULL_REQUEST_BASE"
            if [[ -z "$base" ]]; then
              base="$PUSH_BASE"
            fi
            python3 scripts/gates/cli.py run --mode incremental --base "$base"
          fi

      - name: Upload immutable Gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/quality/runs/
          retention-days: 14
          if-no-files-found: error
