name: Quality

on:
  push:
    branches: [main, main_java]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full-mode:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: macos-15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check native macOS arm64 host
        run: test "$(uname -sm)" = 'Darwin arm64'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          architecture: arm64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
          build-scan-publish: false

      - name: Verify dependency lock
        run: uv lock --project scripts --check

      - name: Install dependencies
        run: UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.local/python/venv" uv sync --project scripts --frozen --extra dev

      - name: Install Playwright dependencies
        run: npm ci --prefix java/tests/playwright

      - name: Install locked Playwright Chromium
        working-directory: java/tests/playwright
        run: npx playwright install chromium

      - name: Prepare empty ignored OpenSpec workspace for a fresh checkout
        run: mkdir -p openspec/changes

      - name: Prepare installed CLI for clean runner contract tests
        run: ./java/gradlew -p java :java:app-cli:installDist --no-daemon

      - name: Unified quality gates
        shell: bash
        env:
          FULL_MODE: ${{ inputs.full-mode }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$FULL_MODE" == "true" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/gates/cli.py run --mode full
          else
            base="$PULL_REQUEST_BASE"
            if [[ -z "$base" ]]; then
              base="$PUSH_BASE"
            fi
            python3 scripts/gates/cli.py run --mode incremental --base "$base"
          fi

      - name: Require a complete successful receipt from this checkout
        shell: bash
        env:
          REQUIRE_FULL: ${{ inputs.full-mode || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PYTHON_CODE'
          import json
          import os
          from pathlib import Path

          root = Path('tmp/quality/runs').resolve()
          pointer = json.loads((root / 'latest.json').read_text())
          summary_path = (root / pointer['summary']).resolve()
          assert summary_path.is_relative_to(root), 'Unsafe Gate receipt pointer'
          summary = json.loads(summary_path.read_text())
          plan = json.loads(summary_path.with_name('plan.json').read_text())
          assert summary['kind'] == 'gate-run-receipt'
          assert summary['runId'] == pointer['runId']
          assert summary['status'] == 'PASS', summary['status']
          assert summary['snapshot']['head'] == os.environ['GITHUB_SHA']
          assert summary['planFingerprint'] == plan['planFingerprint']
          if os.environ['REQUIRE_FULL'] == 'true':
              assert summary['mode'] == plan['mode'] == 'full'
              assert plan['selector'] is None
              expected = {gate['gate']: gate for gate in plan['gates']}
              results = summary['gateResults']
              assert expected and len(results) == len(expected)
              assert {gate['gate'] for gate in results} == set(expected)
              for gate in results:
                  assert gate['status'] == 'PASS', gate['gate']
                  steps = gate['recipeSteps']
                  names = {step['name'] for step in expected[gate['gate']]['recipeSteps']}
                  assert names and len(steps) == len(names)
                  assert {step['recipeStep'] for step in steps} == names
                  for step in steps:
                      assert step['status'] == 'PASS', step['recipeStep']
                      assert step['invocationResults'], step['recipeStep']
                      for invocation in step['invocationResults']:
                          assert invocation['status'] == 'PASS' and invocation['returnCode'] == 0
                          assert not invocation['taskFailureReasons']
          print('Verified actual Gate receipt:', summary['runId'])
          PYTHON_CODE

      - name: Upload immutable Gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/quality/runs/
          retention-days: 14
          if-no-files-found: error
