[project]
name = "feipi-session-browser-dev-tools"
version = "0"
description = "Python developer tooling for the Java session browser repository."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = [
  "bandit",
  "coverage",
  "deptry",
  "pip-audit",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pre-commit",
  "ruff",
  "vulture",
  "xenon",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n auto"
cache_dir = ".local/python/pytest-cache"
markers = [
    "contract_case: Mark test with acceptance contract case ID(s)",
]

[tool.coverage.run]
branch = true
data_file = ".local/python/coverage/.coverage"
source = ["scripts"]
omit = [
  "tests/*",
  "tmp/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = ".local/python/coverage/coverage.xml"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".local/python/ruff-cache"
src = ["scripts", "tests"]
extend-exclude = [
  "tmp",
  "data",
  "output",
  ".local",
  ".pytest_cache",
  "__pycache__",
  "tests/performance",
  "tests/playwright",
  "tests/rendering",
  "tests/session_detail",
  "tests/ui",
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "RET",
  "TCH",
  "RUF",
  "PLC",
  "PLE",
  "PLW",
]
ignore = [
  "E501",
  "PLC0415",
  "PLW0603",
  "PLW1510",
  "PLW2901",
  "RET504",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF059",
  "RUF100",
  "B007",
  "E741",
  "F541",
]

[tool.bandit]
targets = ["scripts"]
exclude_dirs = ["tests", "tmp", "data", "output", ".local"]
skips = []

[tool.deptry]
known_first_party = ["scripts"]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = [
  "tmp",
  "data",
  "output",
  "build",
  "dist",
]

[tool.vulture]
paths = ["scripts", "tests/harness", "tests/misc", "tests/quality"]
exclude = [
  "tmp",
  "data",
  "output",
  ".local",
]
min_confidence = 90
