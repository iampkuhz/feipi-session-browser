default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff
        args: ["--fix"]
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: python-comment-language
        name: python comment language
        entry: >-
          python3 -m scripts.checks source.comment-language
          --script-comments scripts
          --policy config/technical-terms.json
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: python-security
        name: python security
        entry: bash -c './scripts/session-browser.sh audit'
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: python-complexity
        name: python complexity
        entry: bash -c './scripts/session-browser.sh complexity'
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: python-dead-code
        name: python dead code
        entry: bash -c './scripts/session-browser.sh dead-code'
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: python-deps
        name: python dependencies
        entry: bash -c './scripts/session-browser.sh deps-check'
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
