default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff
        args: ["--fix"]
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: python-comment-language
        name: python comment language
        entry: >-
          python3 -m scripts.checks source.comment-language
          --script-comments scripts
          --policy config/technical-terms.json
        language: system
        types_or: [python, pyi]
        pass_filenames: false
