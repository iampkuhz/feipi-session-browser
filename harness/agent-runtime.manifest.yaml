schemaVersion: 1
version: 1
generated_by: repository-maintained-agent-runtime-manifest
policy_files:
  - AGENTS.md
  - CLAUDE.md
  - .codex/model-instructions.md
  - .codex/config.toml
  - .qoder/AGENTS.md
  - .qoder/settings.json
protected_roots:
  - .claude/
  - .codex/
  - .qoder/
  - .agents/
  - skills/
  - harness/
  - scripts/
  - openspec/
  - src/session_browser/
  - tests/
  - AGENTS.md
  - CLAUDE.md
platforms:
  claude:
    config_files:
      - .claude/settings.json
    hooks:
      session_start: [.claude/hooks/session-start.sh]
      cwd_changed: [.claude/hooks/cwd-changed.sh]
      subagent_start: [.claude/hooks/subagent-start.sh]
      pre_bash: [.claude/hooks/pre-bash.sh]
      pre_write: [.claude/hooks/pre-write.sh]
      post_bash: [.claude/hooks/post-bash.sh]
      post_write: [.claude/hooks/post-write.sh]
      tool_failure: [.claude/hooks/tool-failure.sh]
      stop: [.claude/hooks/stop.sh]
      subagent_stop: [.claude/hooks/subagent-stop.sh]
      config_change: [.claude/hooks/config-change.sh]
      session_end: [.claude/hooks/session-end.sh]
    agents_dir: .claude/agents
    skills_dir: .claude/skills
  codex:
    config_files:
      - .codex/config.toml
      - .codex/hooks.json
    codex_hook_binding_note: Repository fixtures cover SessionStart and catch-all PreToolUse bootstrap for Codex App/CLI; real end-to-end client lifecycle remains UNVERIFIED.
    hooks:
      session_start: [.codex/hooks/session-start.sh]
      pre_tool_bootstrap: [.codex/hooks/pre_tool_bootstrap.sh]
      pre_bash: [.codex/hooks/pre_tool_guard.sh]
      pre_write: [.codex/hooks/pre_write_guard.sh]
      post_bash: [.codex/hooks/post_bash_guard.sh]
      post_write: [.codex/hooks/post_tool_guard.sh]
      tool_failure: [.codex/hooks/tool_failure.sh]
      stop: [.codex/hooks/stop_check.sh]
      stop_failure: [.codex/hooks/stop_failure.sh]
      session_end: [.codex/hooks/session_end.sh]
    agents_dir: .codex/agents
    skills_dir: .agents/skills
  qoder:
    config_files:
      - .qoder/AGENTS.md
      - .qoder/settings.json
      - .qoder/settings.local.example.json
    qoder_hook_binding_note: Repository fixtures cover CLI SessionStart/CwdChanged and client UserPromptSubmit/PreToolUse fallback; real end-to-end client lifecycle remains UNVERIFIED.
    hooks:
      session_start: [.qoder/hooks/session-start.sh]
      cwd_changed: [.qoder/hooks/cwd-changed.sh]
      user_prompt_submit: [.qoder/hooks/user-prompt-submit.sh]
      pre_tool_bootstrap: [.qoder/hooks/pre_tool_bootstrap.sh]
      pre_bash: [.qoder/hooks/pre_tool_guard.sh]
      pre_write: [.qoder/hooks/pre_write_guard.sh]
      post_bash: [.qoder/hooks/post_bash_guard.sh]
      post_write: [.qoder/hooks/post_tool_guard.sh]
      tool_failure: [.qoder/hooks/tool_failure.sh]
      stop: [.qoder/hooks/stop_check.sh]
      stop_failure: [.qoder/hooks/stop_failure.sh]
      session_end: [.qoder/hooks/session_end.sh]
    agents_dir: .qoder/agents
    skills_dir: .qoder/skills
platform_hook_adapter:
  authority: scripts/claude_hooks/adapter.py
  service: scripts/harness/sessionctl.py bootstrap
  checkout_source: payload cwd resolved through Git facts
  requires_feipi_run_id: false
  creates_worktree: false
  surfaces:
    codex-app: {client: codex, validation: UNVERIFIED}
    codex-cli: {client: codex, validation: UNVERIFIED}
    claude-code-cli: {client: claude, validation: UNVERIFIED}
    qoder-cli: {client: qoder, validation: UNVERIFIED}
    qoder-client: {client: qoder, validation: UNVERIFIED}
worktree_isolation:
  mode: adopt-client-selected-checkout
  applies_to_clients: [claude, codex, qoder]
  identity_key: repo-key plus canonical checkout realpath
  checkout_kinds: [primary-checkout, linked-worktree]
  checkout_creators: [codex, claude, qoder, external, unknown]
  authorization_facts: [git-top-level, git-common-dir, worktree-list, checkout-realpath]
  ignored_identity_hints: [path-prefix, directory-name, client-name, branch-name, detached-state]
  subagent_behavior: inherit-main-session-worktree
  lifecycle_owner: client-or-external-provider
  sessionctl: scripts/harness/sessionctl.py bootstrap
  registry_root: FEIPI_AGENT_RUNTIME_ROOT or TMPDIR/feipi-agent-runtime/<repo-key>
  enforcement_hooks:
    session_start: shared-idempotent-bootstrap
    user_prompt_submit: qoder-client-idempotent-bootstrap-fallback
    cwd_changed: claude-and-qoder-checkout-reconfirmation
    pre_tool_bootstrap: codex-and-qoder-idempotent-bootstrap-fallback
    pre_bash: all-clients-mutating-bash
    pre_write: all-clients-write-like-tools
    stop: all-clients-fail-closed-on-wrong-checkout-with-changes

resource_isolation:
  lock_root: runtime-root/locks
  lock_manager: scripts/harness/resource_lock.py
  port_allocator: scripts/harness/port_allocator.py
  ordered_multi_resource_acquire: true
  stale_pid_reclaim: true
  owner_metadata_fields: [runId, client, sessionId, worktreeId, target, pid, processStartTime, acquiredAt, hostMarker]
  named_resources:
    - gradle-daemon
    - java-build-tree
    - fixture-server
    - playwright-browser
    - runtime-report
  run_scoped_outputs:
    - FEIPI_AGENT_RUNTIME_ROOT/runs/<run-id>/tmp
    - FEIPI_AGENT_RUNTIME_ROOT/runs/<run-id>/playwright
    - tmp/quality/<client>/<session-id>/runs/<run-id>/main

shared_skills:
  registry: harness/skill-registry.yaml
  source_root: skills/authoring
  exposed_roots:
    - .agents/skills
    - .qoder/skills
  required:
    - feipi-openspec-orchestrate-change
    - feipi-java-feature-dev
    - feipi-session-ingestion-dev
    - feipi-session-detail-ui-dev
    - feipi-mhtml-export-dev
    - feipi-quality-gate-diagnosis
    - feipi-privacy-redaction-dev
permission_policy:
  committed_settings_must_not_contain_local_absolute_paths: true
  bypass_permissions_allowed_only_with_pre_write_guard: true
  local_settings_example: .claude/settings.local.example.json
  qoder_local_settings_example: .qoder/settings.local.example.json
required_gates:
  - scripts/quality/check_agent_runtime_manifest.py
  - scripts/quality/check_agent_hook_parity.py
  - scripts/quality/check_no_committed_local_paths.py
  - scripts/quality/check_agent_permission_policy.py
  - scripts/quality/check_agent_policy_size.py
  - scripts/quality/check_agent_rules_sync.py
  - scripts/quality/check_agent_runtime_isolation.py
  - scripts/quality/check_agent_runtime_worktree.py
  - scripts/quality/check_gate_bypass_resistance.py
  - scripts/quality/measure_gate_escape_rate.py
  - scripts/quality/check_protected_roots_sync.py
  - scripts/quality/check_hook_payload_compat.py
  - scripts/quality/check_subagent_handoff_protocol.py
  - scripts/quality/check_skill_registry.py
  - scripts/quality/check_agent_entry_parity.py
  - scripts/quality/check_qoder_runtime_parity.py
  - scripts/quality/check_no_real_session_fixtures.py
  - scripts/quality/check_secret_like_content.py
  - scripts/quality/run_required_quality_gates.py
  - scripts/quality/check_agent_runtime_report.py
  - scripts/harness/doctor.sh
primary_sessions:
  writable_isolation: checkout-writer-lease
  same_worktree_max_writers: 1
  read_only_sessions_allowed: true
  identity_layers:
    primary_run: runId
    client_session: sessionId
    subagent: agentId-inherits-runId
run_record:
  required_fields:
    - schemaVersion
    - runId
    - repoKey
    - client
    - taskId
    - sessionId
    - worktreeId
    - checkoutRoot
    - checkoutKind
    - checkoutCreator
    - gitCommonDir
    - branch
    - detached
    - targetBranch
    - primaryRepoRoot
    - baseCommit
    - headCommit
    - initialDirtySnapshot
    - changeAttribution
    - changeId
    - status
    - allowedPaths
    - forbiddenPaths
    - writerLease
    - hookActivation
    - createdAt
    - updatedAt
  statuses:
    - BOOTSTRAPPED
    - READ_ONLY_READY
    - ISOLATED_WRITER
    - LOCAL_WRITER
    - READ_ONLY_CONFLICT
    - VALIDATING
    - VALIDATED
    - INTEGRATING
    - INTEGRATED
    - HANDOFF_REQUIRED
    - BLOCKED
status_machine:
  initial_status: BOOTSTRAPPED
  terminal_statuses:
    - INTEGRATED
    - HANDOFF_REQUIRED
    - BLOCKED
  writable_ready_statuses:
    - ISOLATED_WRITER
    - LOCAL_WRITER
  transitions:
    BOOTSTRAPPED:
      - READ_ONLY_READY
      - ISOLATED_WRITER
      - LOCAL_WRITER
      - READ_ONLY_CONFLICT
      - VALIDATING
      - HANDOFF_REQUIRED
      - BLOCKED
    READ_ONLY_READY:
      - ISOLATED_WRITER
      - LOCAL_WRITER
      - READ_ONLY_CONFLICT
      - VALIDATING
      - HANDOFF_REQUIRED
      - BLOCKED
    ISOLATED_WRITER:
      - READ_ONLY_READY
      - VALIDATING
      - HANDOFF_REQUIRED
      - BLOCKED
    LOCAL_WRITER:
      - READ_ONLY_READY
      - VALIDATING
      - HANDOFF_REQUIRED
      - BLOCKED
    READ_ONLY_CONFLICT:
      - ISOLATED_WRITER
      - LOCAL_WRITER
      - VALIDATING
      - HANDOFF_REQUIRED
      - BLOCKED
    VALIDATING:
      - READ_ONLY_READY
      - VALIDATED
      - ISOLATED_WRITER
      - LOCAL_WRITER
      - HANDOFF_REQUIRED
      - BLOCKED
    VALIDATED:
      - VALIDATING
      - ISOLATED_WRITER
      - LOCAL_WRITER
      - READ_ONLY_CONFLICT
      - INTEGRATING
      - HANDOFF_REQUIRED
      - BLOCKED
    INTEGRATING:
      - INTEGRATED
      - HANDOFF_REQUIRED
      - BLOCKED
    INTEGRATED: []
    HANDOFF_REQUIRED:
      - VALIDATING
      - ISOLATED_WRITER
      - LOCAL_WRITER
      - READ_ONLY_CONFLICT
      - INTEGRATING
      - BLOCKED
    BLOCKED: []
runtime_root:
  resolution_order:
    - FEIPI_AGENT_RUNTIME_ROOT
    - TMPDIR-or-system-temp/feipi-agent-runtime/<repo-key>
  repo_key: sha256 of canonical Git common-dir identity
  ordinary_checkout: use the repository-scoped system temporary directory
  linked_worktree: use the same repo-key as the primary checkout without writing Git metadata
  directory_mode: "0700"
  file_mode: "0600"
  symlink_policy: reject managed symlinks
  committed_config_absolute_paths_allowed: false
registry_storage:
  root: runtime_root
  runs_dir: runs
  writer_leases_dir: writer-leases
  locks_dir: locks
  atomic_write: write-temp-then-replace
  lock_scope: repository-runtime-root
collision_policy:
  same_worktree_second_writer: BLOCK
  stale_fencing_token: BLOCK
  hook_activation_unconfirmed:
    writable_ready_allowed: false
subagents:
  inherit_parent_run_id: true
  require_independent_agent_id: true
  create_primary_run: false
