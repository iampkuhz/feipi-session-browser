schemaVersion: 1
version: 1
generated_by: repository-maintained-agent-runtime-manifest
policy_files:
  - AGENTS.md
  - CLAUDE.md
  - .codex/model-instructions.md
  - .codex/config.toml
  - .qoder/AGENTS.md
  - .qoder/settings.json
protected_roots:
  - .claude/
  - .codex/
  - .qoder/
  - .agents/
  - skills/
  - harness/
  - scripts/
  - openspec/
  - src/session_browser/
  - tests/
  - AGENTS.md
  - CLAUDE.md
platforms:
  claude:
    config_files:
      - .claude/settings.json
    hooks:
      session_start: [.claude/hooks/session-start.sh]
      subagent_start: [.claude/hooks/subagent-start.sh]
      pre_bash: [.claude/hooks/pre-bash.sh]
      pre_write: [.claude/hooks/pre-write.sh]
      post_bash: [.claude/hooks/post-bash.sh]
      post_write: [.claude/hooks/post-write.sh]
      tool_failure: [.claude/hooks/tool-failure.sh]
      stop: [.claude/hooks/stop.sh]
      subagent_stop: [.claude/hooks/subagent-stop.sh]
      config_change: [.claude/hooks/config-change.sh]
    agents_dir: .claude/agents
    skills_dir: .claude/skills
  codex:
    config_files:
      - .codex/config.toml
      - .codex/hooks.json
    codex_hook_binding_note: Codex CLI help exposes --dangerously-bypass-hook-trust; local CLI help does not expose a machine-readable hook schema command, so repository validation fail-closes on the checked-in command hook convention, activation marker, and config hash.
    hooks:
      session_start: [.codex/hooks/session-start.sh]
      pre_bash: [.codex/hooks/pre_tool_guard.sh]
      pre_write: [.codex/hooks/pre_write_guard.sh]
      post_bash: [.codex/hooks/post_bash_guard.sh]
      post_write: [.codex/hooks/post_tool_guard.sh]
      tool_failure: [.codex/hooks/tool_failure.sh]
      stop: [.codex/hooks/stop_check.sh]
      stop_failure: [.codex/hooks/stop_failure.sh]
      session_end: [.codex/hooks/session_end.sh]
    agents_dir: .codex/agents
    skills_dir: .agents/skills
  qoder:
    config_files:
      - .qoder/AGENTS.md
      - .qoder/settings.json
      - .qoder/settings.local.example.json
      - .qoder/hook-bindings.md
    qoder_hook_binding_note: qoder settings use the repository hook schema convention shared with .claude/settings.json and .codex/hooks.json; no local Qoder CLI/schema was available during validation, so unsupported native WorktreeCreate/WorktreeRemove remain documented with fallback.
    hooks:
      session_start: [.qoder/hooks/session-start.sh]
      pre_bash: [.qoder/hooks/pre_tool_guard.sh]
      pre_write: [.qoder/hooks/pre_write_guard.sh]
      post_bash: [.qoder/hooks/post_bash_guard.sh]
      post_write: [.qoder/hooks/post_tool_guard.sh]
      tool_failure: [.qoder/hooks/tool_failure.sh]
      stop: [.qoder/hooks/stop_check.sh]
      stop_failure: [.qoder/hooks/stop_failure.sh]
      session_end: [.qoder/hooks/session_end.sh]
      worktree_create_unsupported_reason: Qoder native WorktreeCreate lifecycle is not present in repository-supported hook schema; launcher/sessionctl worktree binding is the fallback.
      worktree_remove_unsupported_reason: Qoder native WorktreeRemove lifecycle is not present in repository-supported hook schema; sessionctl cleanup is the fallback.
    agents_dir: .qoder/agents
    skills_dir: .qoder/skills
primary_session_rollout:
  modes: [managed-worktree, read-only-unbound, blocked]
  safe_defaults:
    sessionctl_start: managed-worktree
    direct_launch: read-only-unbound
  multi_primary_writable_only: managed-worktree
  legacy_data_read_compatibility:
    tmp_agent_logs: readable-no-auto-migration
    tmp_active_change_json: recover-legacy-read-only-only
  rollback:
    cleanup_default: dry-run
    keep_worktree_and_branch: true
    dirty_worktree_cleanup: BLOCK

worktree_isolation:
  mode: per-main-session-git-worktree
  applies_to_clients: [claude, codex, qoder]
  identity_key: client/session_id
  subagent_behavior: inherit-main-session-worktree
  default_parent: outside-repository-root
  assignment_marker: removed; run records are authoritative
  sessionctl: scripts/harness/sessionctl.py
  registry_root: FEIPI_AGENT_RUNTIME_ROOT or git-common-dir/feipi-agent-runtime
  enforcement_hooks:
    session_start: claude-eager-create
    pre_bash: all-clients-mutating-bash
    pre_write: all-clients-write-like-tools
    stop: all-clients-fail-closed-on-wrong-checkout-with-changes

resource_isolation:
  lock_root: FEIPI_AGENT_RUNTIME_ROOT/locks
  lock_manager: scripts/harness/resource_lock.py
  port_allocator: scripts/harness/port_allocator.py
  ordered_multi_resource_acquire: true
  stale_pid_reclaim: true
  owner_metadata_fields: [runId, client, sessionId, worktreeId, target, pid, processStartTime, acquiredAt, hostMarker]
  named_resources:
    - gradle-daemon
    - java-build-tree
    - fixture-server
    - playwright-browser
    - runtime-report
  run_scoped_outputs:
    - FEIPI_AGENT_RUNTIME_ROOT/runs/<run-id>/tmp
    - FEIPI_AGENT_RUNTIME_ROOT/runs/<run-id>/playwright
    - tmp/quality/<client>/<session-id>/runs/<run-id>/main

shared_skills:
  registry: harness/skill-registry.yaml
  source_root: skills/authoring
  exposed_roots:
    - .agents/skills
    - .qoder/skills
  required:
    - feipi-openspec-orchestrate-change
    - feipi-java-feature-dev
    - feipi-session-ingestion-dev
    - feipi-session-detail-ui-dev
    - feipi-mhtml-export-dev
    - feipi-quality-gate-diagnosis
    - feipi-privacy-redaction-dev
permission_policy:
  committed_settings_must_not_contain_local_absolute_paths: true
  bypass_permissions_allowed_only_with_pre_write_guard: true
  local_settings_example: .claude/settings.local.example.json
  qoder_local_settings_example: .qoder/settings.local.example.json
required_gates:
  - scripts/quality/check_agent_runtime_manifest.py
  - scripts/quality/check_agent_hook_parity.py
  - scripts/quality/check_no_committed_local_paths.py
  - scripts/quality/check_agent_permission_policy.py
  - scripts/quality/check_agent_policy_size.py
  - scripts/quality/check_agent_rules_sync.py
  - scripts/quality/check_agent_runtime_isolation.py
  - scripts/quality/check_agent_runtime_worktree.py
  - scripts/quality/check_gate_bypass_resistance.py
  - scripts/quality/measure_gate_escape_rate.py
  - scripts/quality/check_protected_roots_sync.py
  - scripts/quality/check_hook_payload_compat.py
  - scripts/quality/check_subagent_handoff_protocol.py
  - scripts/quality/check_skill_registry.py
  - scripts/quality/check_agent_entry_parity.py
  - scripts/quality/check_qoder_runtime_parity.py
  - scripts/quality/check_no_real_session_fixtures.py
  - scripts/quality/check_secret_like_content.py
  - scripts/quality/run_required_quality_gates.py
  - scripts/quality/check_agent_runtime_report.py
  - scripts/harness/doctor.sh
primary_sessions:
  writable_isolation: git-worktree-required
  same_worktree_max_writers: 1
  read_only_sessions_allowed: true
  identity_layers:
    primary_run: runId
    client_session: sessionId
    subagent: agentId-inherits-runId
  rollout_modes:
    managed-worktree: sessionctl-created only multi-primary writable mode
    read-only-unbound: direct client launch without bound run; mutations blocked
    blocked: fail-closed for unsafe identity, hook, lease, registry, lock, stop, or cleanup states
  default_policy:
    sessionctl_start: managed-worktree
    direct_launch: read-only-unbound
run_record:
  required_fields:
    - schemaVersion
    - runId
    - client
    - taskId
    - sessionId
    - worktreeId
    - worktreeRoot
    - branch
    - targetBranch
    - primaryRepoRoot
    - baseCommit
    - headCommit
    - changeId
    - mode
    - status
    - allowedPaths
    - forbiddenPaths
    - resourceAllocations
    - writerLease
    - hookActivation
    - processes
    - createdAt
    - updatedAt
  modes:
    - read-only
    - writable
  statuses:
    - CREATED
    - STARTING
    - RUNNING
    - VALIDATING
    - VALIDATED
    - COMMITTED
    - INTEGRATING
    - INTEGRATED
    - CLEANED
    - BLOCKED
    - HANDOFF_REQUIRED
    - FAILED
status_machine:
  initial_status: CREATED
  terminal_statuses:
    - INTEGRATED
    - CLEANED
    - FAILED
    - HANDOFF_REQUIRED
  writable_ready_statuses:
    - RUNNING
    - VALIDATING
    - VALIDATED
    - COMMITTED
  transitions:
    CREATED:
      - STARTING
      - RUNNING
      - BLOCKED
      - FAILED
    STARTING:
      - RUNNING
      - BLOCKED
      - FAILED
    RUNNING:
      - VALIDATING
      - BLOCKED
      - FAILED
    VALIDATING:
      - RUNNING
      - VALIDATED
      - BLOCKED
      - FAILED
    VALIDATED:
      - COMMITTED
      - INTEGRATING
      - BLOCKED
      - HANDOFF_REQUIRED
      - FAILED
    COMMITTED:
      - INTEGRATING
      - HANDOFF_REQUIRED
      - FAILED
    INTEGRATING:
      - INTEGRATED
      - HANDOFF_REQUIRED
      - FAILED
    INTEGRATED:
      - CLEANED
    BLOCKED:
      - STARTING
      - RUNNING
      - VALIDATING
      - HANDOFF_REQUIRED
      - FAILED
    HANDOFF_REQUIRED:
      - STARTING
      - RUNNING
      - FAILED
      - CLEANED
    FAILED:
      - CLEANED
    CLEANED: []
runtime_root:
  resolution_order:
    - FEIPI_AGENT_RUNTIME_ROOT
    - git-common-dir/feipi-agent-runtime
  ordinary_checkout: use git common dir under the checkout .git directory
  linked_worktree: use linked worktree git common dir so all worktrees share one registry
  committed_config_absolute_paths_allowed: false
registry_storage:
  root: runtime_root
  runs_dir: runs
  writer_leases_dir: writer-leases
  branch_leases_dir: branch-leases
  locks_dir: locks
  atomic_write: write-temp-then-replace
  lock_scope: repository-runtime-root
collision_policy:
  same_worktree_second_writer: BLOCK
  same_branch_active_writable_runs: BLOCK
  write_scope_intersection_default: BLOCK
  missing_session_id:
    allowed_statuses:
      - CREATED
      - STARTING
      - BLOCKED
    write_allowed: false
  hook_activation_unconfirmed:
    writable_ready_allowed: false
subagents:
  inherit_parent_run_id: true
  require_independent_agent_id: true
  create_primary_run: false
