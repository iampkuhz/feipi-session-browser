schemaVersion: 1
project:
  name: feipi-session-browser
  type: java-product
  description: Local session browser for Claude Code, Codex, and Qoder session data.

agent_contract:
  policy_manifest: harness/agent-policy.manifest.yaml
  lifecycle_manifest: harness/agent-runtime.manifest.yaml
  lifecycle_owner: client
  platform_event_bindings: false
  validation_mode: explicit
  skill_entrypoints:
    openspec_orchestrate_change: skills/authoring/feipi-openspec-orchestrate-change/SKILL.md
    codex_repo_scope: .agents/skills/feipi-openspec-orchestrate-change
    codex_convention: .codex/skills/feipi-openspec-orchestrate-change
    claude: .claude/skills/feipi-openspec-orchestrate-change

public_executables:
  deps: "./scripts/session-browser.sh deps"
  test: "./scripts/session-browser.sh test"
  scan: "./scripts/session-browser.sh scan"
  serve: "./scripts/session-browser.sh serve"
  doctor: "bash scripts/harness/doctor.sh"
  quality_gate: "python3 scripts/gates/cli.py"
  openspec_layout: "python3 scripts/openspec/validate_layout.py"
  openspec_schema: "python3 scripts/openspec/validate_schema.py"
  openspec_active_change: "python3 scripts/openspec/validate_active_change.py"
  harness_structure: "python3 scripts/harness/validate_harness_structure.py"
  release_candidate_verify: "bash scripts/release/create-release-candidate.sh verify"
  release_candidate_create: "bash scripts/release/create-release-candidate.sh create"
  release_checksums: "bash scripts/release/generate-checksums.sh"
  release_rollback_drill: "bash scripts/release/drill-upgrade-rollback.sh"
  qoder_task: "python3 scripts/harness/qoder_task.py"

quality:
  runner: scripts/gates/cli.py
  delivery_command: python3 scripts/gates/cli.py run --mode incremental
  full_command: python3 scripts/gates/cli.py run --mode full
  target_presets: [agent-governance, java-source, java-build]

quality_gates:
  - name: incremental
    command: "python3 scripts/gates/cli.py run --mode incremental"
    required: true

docs:
  - docs/agent-runtime.md
  - skills/authoring/feipi-openspec-orchestrate-change/SKILL.md
  - harness/README.md
  - scripts/README.md
  - docs/gates/gate-control-plane.md
  - scripts/gates/checks/README.md

local_only:
  - ".claude/settings.local.json"
  - ".qoder/settings.local.json"
  - ".mcp.json"
  - ".env"
  - ".local/"
  - "tmp/agent_logs/"
  - "tmp/quality/"

forbidden_root_paths:
  - ".gradle/"
  - ".venv/"
  - "build/"
  - "build-logic/"
  - "lombok.config"
  - "package.json"
  - "package-lock.json"
  - "playwright.config.js"
  - "node_modules/"
  - "reports/"
  - "harness/reports/"
  - "java/tests/playwright/test-results/"
  - "harness/.local/"
  - "scripts/tests/.local/"
  - ".agent/"
  - ".traces/"
  - ".refactor-artifacts/"
  - "config/"
  - "feipi_jakarta_validation_prompt_tasks/"
  - "out/"
  - "data/"
  - "output/"
  - ".coverage"
  - "coverage.xml"
  - ".pytest_cache/"
  - ".ruff_cache/"
