schemaVersion: 1
project:
  name: feipi-session-browser
  type: java-product
  description: Local session browser for Claude Code, Codex, and Qoder session data.

runtime:
  hook_entry: scripts/agent_runtime/hook_entry.py
  shared_stop_entry: scripts/harness/stop_entry.py
  stop_pipeline: scripts/agent_runtime/stop/pipeline.py
  python_package: scripts.agent_runtime
  log_dir: tmp/agent_logs/
  runtime_manifest: harness/agent-runtime.manifest.yaml
  resource_lock_manager: scripts/harness/resource_lock.py
  port_allocator: scripts/harness/port_allocator.py
  runtime_root: FEIPI_AGENT_RUNTIME_ROOT or TMPDIR/feipi-agent-runtime/<repo-key>
  agent_entrypoints:
    claude_session_start: .claude/hooks/session-start.sh
    claude_cwd_changed: .claude/hooks/cwd-changed.sh
    claude_session_end: .claude/hooks/session-end.sh
    codex_session_start: .codex/hooks/session-start.sh
    codex_pre_tool_bootstrap: .codex/hooks/pre_tool_bootstrap.sh
    claude_stop: .claude/hooks/stop.sh
    codex_pre_tool: .codex/hooks/pre_tool_guard.sh
    codex_post_tool: .codex/hooks/post_tool_guard.sh
    codex_stop: .codex/hooks/stop_check.sh
    qoder_session_start: .qoder/hooks/session-start.sh
    qoder_cwd_changed: .qoder/hooks/cwd-changed.sh
    qoder_user_prompt_submit: .qoder/hooks/user-prompt-submit.sh
    qoder_pre_tool_bootstrap: .qoder/hooks/pre_tool_bootstrap.sh
    qoder_pre_tool: .qoder/hooks/pre_tool_guard.sh
    qoder_post_tool: .qoder/hooks/post_tool_guard.sh
    qoder_stop: .qoder/hooks/stop_check.sh
    qoder_tool_failure: .qoder/hooks/tool_failure.sh
    qoder_stop_failure: .qoder/hooks/stop_failure.sh
    qoder_session_end: .qoder/hooks/session_end.sh
  skill_entrypoints:
    openspec_orchestrate_change: skills/authoring/feipi-openspec-orchestrate-change/SKILL.md
    codex_repo_scope: .agents/skills/feipi-openspec-orchestrate-change
    codex_convention: .codex/skills/feipi-openspec-orchestrate-change
    claude: .claude/skills/feipi-openspec-orchestrate-change

entrypoints:
  deps: "./scripts/session-browser.sh deps"
  test: "./scripts/session-browser.sh test"
  scan: "./scripts/session-browser.sh scan"
  serve: "./scripts/session-browser.sh serve"
  doctor: "bash scripts/harness/doctor.sh"
  sessionctl: "python3 scripts/harness/sessionctl.py"

quality:
  runner: scripts/gates/cli.py
  targets:
    - hook-runtime
    - harness
    - acceptance-contracts
    - java-src
    - java-build
  # target dominance 声明: 避免重复运行 Gradle baseline
  dominance:
    java-src:
      includes: [java-build]

quality_gates:
  - name: unit-tests
    command: "./scripts/session-browser.sh test"
    required: true
  - name: harness-doctor
    command: "bash scripts/harness/doctor.sh"
    required: true

docs:
  - docs/agent-runtime.md
  - skills/authoring/feipi-openspec-orchestrate-change/SKILL.md
  - harness/README.md
  - harness/agent-runtime.md
  - harness/context/repo-map.md
  - harness/context/ui-context.md
  - harness/workflow/change-lifecycle.md
  - harness/workflow/subagent-execution.md
  - harness/quality/deterministic-quality-gate.md
  - harness/quality/quality-gate-matrix.md

local_only:
  - ".claude/settings.local.json"
  - ".qoder/settings.local.json"
  - ".mcp.json"
  - ".env"
  - ".venv/"
  - ".pytest_cache/"
  - "data/"
  - "output/"
  - "tmp/agent_logs/"
  - "tmp/quality/"
