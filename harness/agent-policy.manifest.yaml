version: 1
size_limits:
  AGENTS.md: 2800
  multica_runtime_bytes: 32768
  .claude/CLAUDE.md: 12000
protected_roots:
  - .claude/
  - .codex/
  - .qoder/
  - .qoder/
  - .agents/
  - skills/
  - harness/
  - scripts/
  - openspec/
  - src/session_browser/
  - scripts/tests/
  - java/tests/
  - AGENTS.md
  - .claude/CLAUDE.md
gate_semantics:
  - "失败、未运行、跳过不得描述为 PASS"
  - "不得新增 skip"
  - "required gate 由维护者显式运行"
  - "最终 javaBuildVerification 的根 check 已覆盖全模块测试与零跳过检查时，承接产品 test 证明，不重复执行；缓存命中不得称测试重跑"
privacy:
  forbidden_inputs:
    - real-session-data
    - secrets
    - tokens
    - runtime-cache
    - personal-config
git_safety:
  forbidden_actions:
    - stash
    - reset
    - force
    - rebase
    - unauthorized-push
  integration_requires_explicit_user_choice: true
context_hygiene:
  shared_rule_locations:
    - harness/agent-policy.manifest.yaml
    - harness/agent-runtime.manifest.yaml
    - skills/authoring/
  platform_configs_are_entry_points: true
subagent_instance_protocol:
  required_handoff_fields:
    - Goal
    - Task id
    - Task source
    - Allowed files/directories
    - Forbidden files/directories
    - Required context files
    - Expected output
    - Validation command
    - Failure policy
  required_output_fields:
    - Status
    - Changed files
    - Validation
    - Effect checks
    - Risks
  status_values:
    - PASS
    - FAIL
    - BLOCKED
  identity_rules:
    - 每个 subagent handoff 必须包含 Task id。
    - 同一 agent 的不同实例必须使用唯一 agent_id 或等价 instance id。
    - 并行修改型 subagent 必须拆成不重叠写范围。
    - main agent 只能聚合同一 client/session_id 的 subagent evidence。
    - subagent 返回 FAIL 或 BLOCKED 时，main agent 不得静默跳过 validation。
  skipped_semantics: required validation 出现 skipped、not-run、unavailable 或 excluded 均不得描述为 PASS。
native_delegation:
  implementation: current-agent-native-subagents
  handoff_protocol: subagent_instance_protocol
  model_routing:
    important_implementation: gpt-6.1-sol
    complex_analysis: gpt-6.1-sol
    independent_validation: gpt-6.1-sol
    lightweight_lookup: gpt-6-luna
  host_constraints:
    - 使用宿主原生 API 的模型和上下文参数约束，不固定所有角色模型。
    - 模型覆盖若要求 fork_turns=none，显式传入必要上下文，不依赖隐式历史。
    - 原生能力不可用或模型受限时如实报告，由 main 接管或调整范围。
  lifecycle:
    - 直接使用 spawn_agent/followup_task 和原生等待/完成事件，不轮询仓库状态。
    - main 负责单一目标拆分、独立复核与串行集成；修改型任务写范围互斥。
    - 不新增 CLI、调度器、队列、receipt、callback、watchdog、ack 或仓库状态机。
  permissions:
    - 保持当前环境权限，不继承 Qoder bypass_permissions 默认值。
    - 不因失败升级权限，不降低 Gate，不回滚他人修改。
  retired_evidence:
    - 旧 Qoder PASS 不得作为原生子任务或本次验收证据。
    - 若收到旧 Qoder callback，只识别为已退役，不恢复或重新执行旧调度链。
  validation:
    - 子任务 PASS 不替代 main 独立运行 required checks。
    - required checks 的 failed、warning、skipped、not-run、unavailable 均不得称 PASS。
  product_boundary: 仅退役工程 Qoder 派发，保留产品 Qoder session 支持和安全保护；不清理 ignored 个人数据。
