version: 1
size_limits:
  AGENTS.md: 2800
  .claude/CLAUDE.md: 12000
required_phrases:
  - "增量 Gate"
  - "不纳入真实 session"
  - "先搜索定位"
  - "OpenSpec"
protected_roots:
  - .claude/
  - .codex/
  - .qoder/
  - .agents/
  - skills/
  - harness/
  - scripts/
  - openspec/
  - AGENTS.md
  - .claude/CLAUDE.md
gate_semantics:
  - "失败、未运行、跳过不得描述为 PASS"
  - "不得新增 skip"
  - "required gate 由维护者显式运行"
privacy:
  forbidden_inputs:
    - real-session-data
    - secrets
    - tokens
    - runtime-cache
    - personal-config
git_safety:
  forbidden_actions:
    - stash
    - reset
    - force
    - rebase
    - unauthorized-push
  integration_requires_explicit_user_choice: true
context_hygiene:
  shared_rule_locations:
    - harness/agent-policy.manifest.yaml
    - harness/agent-runtime.manifest.yaml
    - skills/authoring/
  platform_configs_are_entry_points: true
subagent_instance_protocol:
  required_handoff_fields:
    - Goal
    - Task id
    - Task source
    - Allowed files/directories
    - Forbidden files/directories
    - Required context files
    - Expected output
    - Validation command
    - Failure policy
  required_output_fields:
    - Status
    - Changed files
    - Validation
    - Effect checks
    - Risks
  status_values:
    - PASS
    - FAIL
    - BLOCKED
  identity_rules:
    - 每个 subagent handoff 必须包含 Task id。
    - 同一 agent 的不同实例必须使用唯一 agent_id 或等价 instance id。
    - 并行修改型 subagent 必须拆成不重叠写范围。
    - main agent 只能聚合同一 client/session_id 的 subagent evidence。
    - subagent 返回 FAIL 或 BLOCKED 时，main agent 不得静默跳过 validation。
  skipped_semantics: required validation 出现 skipped、not-run、unavailable 或 excluded 均不得描述为 PASS。
qoder_delegation:
  applies_when:
    - Codex 担任主调度时生效。
  default_implementer: qoder
  default_permission_mode: bypass_permissions
  permission_authorization: 用户明确授权默认跳过 Qoder 工具审批；可显式降权，不绕过 OS 权限。
  max_active_runs: 1
  scheduling:
    overflow: queue
    next_run_requires_confirmed_completion: true
    unknown_status_blocks_dispatch: true
    short_overlap_by_default: false
    codex_independent_work_allowed: true
    enforcement: process-preflight-best-effort
  default_scope:
    - 功能实现
    - 修复
    - 重构
    - 测试
    - 脚本
    - 配置
    - 文档
  exceptions_codex_keeps:
    - 极小修改
    - 设计决策
    - Qoder 不可用
    - 权限不足
    - 两轮返工不收敛
  task_granularity:
    - 单一可验收目标
    - 实现与关联测试一起交付
    - 跨模块先定边界再拆分
    - 只读查询按同一主题批处理
  max_rework_rounds: 2
  visible_dispatch_card:
    - task_id
    - goal_or_source
    - allowed_files
    - forbidden_files
    - required_context
    - acceptance_criteria
    - permission_mode
    - failure_policy
    - change_version
  post_dispatch_fields:
    - run_id
    - result_path
  parallel_constraints:
    - 仅允许 Codex 与单个 Qoder 并行；多个 Qoder 任务串行，不能通过另开 session 绕过。
    - 写写冲突
    - 读写冲突
    - 接口变更冲突
    - 运行输出冲突
    - 集成验证串行
  identity_rules:
    - 保留各 client/session 来源。
    - Codex 独立复核和产出验收证据。
    - Qoder 不得递归委派给自身。
  completion_callback:
    transport: codex-queue
    target: exact-parent-session-uuid
    completion_record_first: true
    automatic_retry: false
    queued_is_delivery_proof: false
  no_auto_features:
    - 无自动重发
    - 无取消
    - 无 OS 沙箱
    - 不因失败自动扩大权限
    - 不降低 Gate
